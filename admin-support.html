<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيلات الدعم المدرسي — لوحة الإدارة</title>
  <link rel="icon" type="image/x-icon" href="images/eplus-icon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="admin-support.css" />
  <style>
    :root {
      --primary: #7C3AED;
      --primary-2: #6D28D9;
      --primary-light: rgba(124,58,237,0.15);
      --primary-glow: rgba(124,58,237,0.35);
      --accent: #F59E0B;
      --accent-soft: rgba(245,158,11,0.12);
      --accent-2: #EC4899;
      --teal: #14B8A6;
      --bg: #F5F3FF;
      --bg-2: #EDE9FE;
      --card-bg: #ffffff;
      --card-bg-2: rgba(255,255,255,0.7);
      --text: #1E1B4B;
      --text-2: #4C4587;
      --text-muted: #8B87B8;
      --border: rgba(124,58,237,0.1);
      --border-2: rgba(124,58,237,0.2);
      --danger: #EF4444;
      --success: #10B981;
      --warning: #F59E0B;
      --shadow: 0 4px 24px rgba(124,58,237,0.08);
      --shadow-lg: 0 12px 40px rgba(124,58,237,0.15);
      --radius: 20px;
      --radius-sm: 12px;
    }
    [data-theme="dark"] {
      --primary: #9D6FFF;
      --primary-2: #8B5CF6;
      --primary-light: rgba(157,111,255,0.18);
      --primary-glow: rgba(157,111,255,0.35);
      --accent: #FBB040;
      --bg: #0F0D1A;
      --bg-2: #181528;
      --card-bg: #1E1B30;
      --card-bg-2: rgba(30,27,48,0.9);
      --text: #EDE9FE;
      --text-2: #C4B5FD;
      --text-muted: #7B72B8;
      --border: rgba(157,111,255,0.14);
      --border-2: rgba(157,111,255,0.28);
      --danger: #F87171;
      --success: #34D399;
      --warning: #FBB040;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.55);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    .app-wrap{display:flex;min-height:100vh}
    .sidebar{width:250px;background:var(--card-bg);border-left:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:100}
    .sidebar-logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;padding:0 8px}
    .sidebar-logo img{height:40px}
    .sidebar-logo-text{font-weight:900;font-size:16px;color:var(--text)}
    .sidebar-logo-sub{font-size:11px;color:var(--text-muted);margin-top:-2px}
    .nav-section{font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;padding:16px 8px 6px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--text-2);text-decoration:none;font-weight:600;font-size:14px;transition:all 0.2s;cursor:pointer}
    .nav-item:hover{background:var(--primary-light);color:var(--primary)}
    .nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:800}
    .nav-item i{width:20px;text-align:center;font-size:16px}
    .main-content{flex:1;padding:24px 32px;max-width:100%;overflow-x:hidden}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .topbar h1{font-size:22px;font-weight:900}
    .topbar-sub{font-size:13px;color:var(--text-muted)}
    .theme-toggle{width:38px;height:38px;border-radius:var(--radius-sm);border:1px solid var(--border-2);background:var(--card-bg);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
    .theme-toggle:hover{border-color:var(--primary)}
    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
    .stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
    .stat-card .stat-icon{font-size:28px;margin-bottom:6px}
    .stat-card .stat-val{font-size:28px;font-weight:900;color:var(--text)}
    .stat-card .stat-label{font-size:12px;color:var(--text-muted);font-weight:600;margin-top:2px}
    .filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
    .filter-btn{padding:7px 16px;border-radius:99px;border:1px solid var(--border-2);background:var(--card-bg);color:var(--text-2);font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:inherit}
    .filter-btn:hover{border-color:var(--primary);color:var(--primary)}
    .filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .filter-btn .count{background:rgba(0,0,0,0.08);padding:1px 8px;border-radius:99px;font-size:11px;margin-right:4px}
    [data-theme="dark"] .filter-btn .count{background:rgba(255,255,255,0.12)}
    .filter-btn.active .count{background:rgba(255,255,255,0.2);color:#fff}
    .search-box{flex:1;min-width:180px;position:relative}
    .search-box input{width:100%;padding:9px 36px 9px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-2);background:var(--card-bg);color:var(--text);font-size:13px;font-family:inherit}
    .search-box input:focus{outline:none;border-color:var(--primary)}
    .search-box i{position:absolute;top:50%;right:12px;transform:translateY(-50%);color:var(--text-muted);font-size:14px}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
    .toolbar select{padding:7px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-2);background:var(--card-bg);color:var(--text);font-size:12px;font-family:inherit}
    .btn-icon{padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-2);background:var(--card-bg);color:var(--text-2);font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
    .btn-icon:hover{border-color:var(--primary);color:var(--primary)}
    .btn-icon.danger:hover{border-color:var(--danger);color:var(--danger)}
    .table-wrap{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
    .table-wrap table{width:100%;border-collapse:collapse;font-size:13px}
    .table-wrap th{background:var(--bg-2);padding:10px 12px;text-align:right;font-weight:800;font-size:12px;color:var(--text-2);white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--border)}
    .table-wrap th:hover{color:var(--primary)}
    .table-wrap td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text)}
    .table-wrap tr:hover td{background:var(--bg-2)}
    .table-wrap .status-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800}
    .status-badge.pending{background:rgba(245,158,11,0.12);color:#D97706}
    .status-badge.confirmed{background:rgba(16,185,129,0.12);color:#059669}
    .status-badge i{font-size:12px}
    .table-wrap .actions{display:flex;gap:4px}
    .table-wrap .actions button{padding:4px 8px;border:none;border-radius:6px;cursor:pointer;font-size:12px;transition:all 0.15s;font-family:inherit}
    .table-wrap .actions .btn-view{background:rgba(124,58,237,0.1);color:var(--primary)}
    .table-wrap .actions .btn-view:hover{background:rgba(124,58,237,0.2)}
    .table-wrap .actions .btn-edit{background:rgba(245,158,11,0.1);color:#D97706}
    .table-wrap .actions .btn-edit:hover{background:rgba(245,158,11,0.2)}
    .table-wrap .actions .btn-delete{background:rgba(239,68,68,0.1);color:var(--danger)}
    .table-wrap .actions .btn-delete:hover{background:rgba(239,68,68,0.2)}
    .table-wrap .actions .btn-confirm{background:rgba(16,185,129,0.1);color:#059669}
    .table-wrap .actions .btn-confirm:hover{background:rgba(16,185,129,0.2)}
    .pagination{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px}
    .pagination button{padding:6px 12px;border:1px solid var(--border-2);border-radius:8px;background:var(--card-bg);color:var(--text-2);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:all 0.15s}
    .pagination button:hover{border-color:var(--primary);color:var(--primary)}
    .pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .pagination button:disabled{opacity:0.4;cursor:not-allowed}
    .pagination .info{font-size:12px;color:var(--text-muted);margin:0 8px}
    .empty-state{text-align:center;padding:48px 20px;color:var(--text-muted)}
    .empty-state i{font-size:40px;margin-bottom:12px;opacity:0.4}
    .empty-state p{font-size:14px}
    .toast{position:fixed;bottom:24px;left:24px;z-index:9999;padding:12px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);display:none;animation:fadeIn 0.3s ease}
    .toast.success{background:#059669;color:#fff}
    .toast.error{background:var(--danger);color:#fff}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .modal-overlay{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal-box{background:var(--card-bg);border-radius:var(--radius);width:100%;max-width:500px;padding:24px;box-shadow:var(--shadow-lg)}
    .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .modal-header h3{font-size:17px;font-weight:800}
    .modal-close{width:32px;height:32px;border:none;border-radius:8px;background:var(--bg-2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text-muted)}
    .modal-close:hover{background:var(--danger-soft, rgba(239,68,68,0.1));color:var(--danger)}
    .modal-actions{display:flex;gap:8px;margin-top:16px}
    .modal-actions button{flex:1;padding:10px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;cursor:pointer;border:none;font-family:inherit}
    .btn-cancel{background:var(--bg-2);color:var(--text-2)}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-primary{background:var(--primary);color:#fff}
    .modal-body{font-size:14px;color:var(--text-2);line-height:1.7}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .detail-item{}
    .detail-item .label{font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase}
    .detail-item .value{font-size:14px;font-weight:600;color:var(--text);margin-top:2px}
    .detail-item.full{grid-column:1/-1}
    .subjects-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
    .subjects-list .subj-tag{padding:2px 8px;border-radius:4px;background:var(--primary-light);color:var(--primary);font-size:11px;font-weight:600}
    @media(max-width:768px){
      .sidebar{display:none}
      .main-content{padding:16px}
      .stats-row{grid-template-columns:1fr 1fr}
      .detail-grid{grid-template-columns:1fr}
    }
    @media print {
      .sidebar,.topbar,.filter-bar,.toolbar,.pagination,.actions{display:none!important}
      .table-wrap{border:none;box-shadow:none}
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="images/education-plus-center-logo.png" alt="E-PLUS" />
        <div><div class="sidebar-logo-text">E-PLUS Center</div><div class="sidebar-logo-sub">لوحة الإدارة</div></div>
      </div>
      <div class="nav-section">التسجيلات</div>
      <a class="nav-item active" href="admin-support.html"><i class="fa-solid fa-book"></i> تسجيلات الدعم المدرسي</a>
      <a class="nav-item" href="admin.html"><i class="fa-solid fa-arrow-left"></i> العودة للوحة الرئيسية</a>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div>
          <h1>📚 تسجيلات الدعم المدرسي</h1>
          <div class="topbar-sub">إدارة ومتابعة طلبات التسجيل في الدعم المدرسي</div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" title="تغيير المظهر">🌙</button>
      </div>

      <div class="stats-row" id="stats-row"></div>

      <div class="filter-bar" id="filter-bar"></div>

      <div class="toolbar">
        <div class="search-box">
          <i class="fa-solid fa-search"></i>
          <input id="search-input" placeholder="بحث..." oninput="applyFilters()" />
        </div>
        <select id="level-filter" onchange="applyFilters()">
          <option value="">جميع المستويات</option>
        </select>
        <select id="stream-filter" onchange="applyFilters()">
          <option value="">جميع الشعب</option>
        </select>
        <select id="institution-filter" onchange="applyFilters()">
          <option value="">جميع المؤسسات</option>
        </select>
        <select id="type-filter" onchange="applyFilters()">
          <option value="">جميع الأنواع</option>
        </select>
        <select id="status-filter" onchange="applyFilters()">
          <option value="">جميع الحالات</option>
          <option value="مسجل مبدئياً">🟡 مسجل مبدئياً</option>
          <option value="مسجل نهائياً">🟢 مسجل نهائياً</option>
        </select>
        <button class="btn-icon" onclick="exportCSV()"><i class="fa-solid fa-file-csv"></i> CSV</button>
        <button class="btn-icon" onclick="exportExcel()"><i class="fa-solid fa-file-excel"></i> Excel</button>
        <button class="btn-icon" onclick="printTable()"><i class="fa-solid fa-print"></i> طباعة</button>
        <button class="btn-icon" onclick="refreshData()"><i class="fa-solid fa-rotate"></i> تحديث</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr id="table-head"></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
        <div class="pagination" id="pagination"></div>
        <div class="empty-state" id="empty-state" style="display:none;">
          <i class="fa-solid fa-inbox"></i>
          <p>لا توجد تسجيلات لعرضها</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal-box" style="max-width:600px;">
      <div class="modal-header">
        <h3>📋 تفاصيل التسجيل</h3>
        <button class="modal-close" onclick="closeModal('detail-modal')">✕</button>
      </div>
      <div class="modal-body" id="detail-content"></div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-box" style="max-width:400px;">
      <div class="modal-header">
        <h3>✅ تأكيد التسجيل</h3>
        <button class="modal-close" onclick="closeModal('confirm-modal')">✕</button>
      </div>
      <div class="modal-body" id="confirm-content"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('confirm-modal')">إلغاء</button>
        <button class="btn-primary" id="confirm-yes" onclick="confirmYes()">تأكيد</button>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal-box" style="max-width:400px;">
      <div class="modal-header">
        <h3>🗑️ حذف التسجيل</h3>
        <button class="modal-close" onclick="closeModal('delete-modal')">✕</button>
      </div>
      <div class="modal-body">هل أنت متأكد من حذف هذا التسجيل؟ لا يمكن التراجع عن هذا الإجراء.</div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('delete-modal')">إلغاء</button>
        <button class="btn-danger" onclick="deleteYes()">حذف</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/ep-ui.js?v=2"></script>
  <script src="admin-support.js"></script>
</body>
</html>

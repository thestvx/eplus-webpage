<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الطالب — E-PLUS</title>
  <link rel="icon" type="image/x-icon" href="images/eplus-icon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: rgba(99,102,241,0.1);
      --gold: #c8a84b;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #059669;
      --success-light: rgba(16,185,129,0.1);
      --warning: #d97706;
      --warning-light: rgba(245,158,11,0.1);
      --danger: #dc2626;
    }
    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .portal-header {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
      padding: 32px 20px 48px;
      text-align: center;
      position: relative;
    }
    .portal-header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 24px;
      background: var(--bg);
      border-radius: 24px 24px 0 0;
    }
    .portal-logo {
      width: 56px;
      height: 56px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 8px;
    }
    .portal-title {
      font-size: 22px;
      font-weight: 900;
      color: white;
      letter-spacing: 0.5px;
    }
    .portal-subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      font-weight: 600;
      margin-top: 2px;
    }
    .welcome-card {
      max-width: 600px;
      margin: -28px auto 20px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      position: relative;
      z-index: 1;
    }
    .welcome-name {
      font-size: 20px;
      font-weight: 900;
      color: var(--text);
    }
    .welcome-id {
      font-size: 12px;
      color: var(--primary);
      font-weight: 700;
      font-family: monospace;
      margin-top: 2px;
    }
    .welcome-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }
    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .meta-badge.level { background: var(--primary-light); color: var(--primary); }
    .meta-badge.type { background: var(--warning-light); color: var(--warning); }
    .meta-badge.status { background: var(--success-light); color: var(--success); }
    .meta-badge.inst { background: rgba(100,116,139,0.1); color: var(--text-muted); }

    .subjects-grid {
      max-width: 600px;
      margin: 0 auto 32px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-label {
      font-size: 14px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subject-card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .subject-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.1);
    }
    .subject-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .subject-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .subject-name {
      font-size: 15px;
      font-weight: 900;
      color: var(--text);
    }
    .subject-teacher {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 1px;
    }
    .subject-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .subject-btn {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Tajawal', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .subject-btn:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }
    .subject-btn.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .subject-btn.primary:hover {
      background: var(--primary-dark);
    }
    .empty-content {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .empty-content .icon { font-size: 40px; margin-bottom: 8px; }

    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .error-icon { font-size: 64px; margin-bottom: 16px; }
    .error-title { font-size: 22px; font-weight: 900; color: var(--text); margin-bottom: 8px; }
    .error-msg { font-size: 14px; color: var(--text-muted); max-width: 400px; line-height: 1.7; }

    .loading-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--text-muted); font-weight: 600; }

    .portal-footer {
      text-align: center;
      padding: 20px;
      font-size: 11px;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .portal-header { padding: 24px 16px 40px; }
      .welcome-card { margin: -24px 12px 16px; padding: 18px; }
      .welcome-name { font-size: 18px; }
      .subjects-grid { padding: 0 12px; }
      .subject-card { padding: 14px 16px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading-page" id="loading-state">
      <div class="spinner"></div>
      <div class="loading-text">جاري تحميل بوابة الطالب...</div>
    </div>
  </div>

  <script>
    const SP_URL = 'https://jftfvpultaqufhsekdle.supabase.co';
    const SP_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmdGZ2cHVsdGFxdWZoc2VrZGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NTI2NzMsImV4cCI6MjA5OTMyODY3M30.ep8b2omBGaN2qUB_XG8EE8XDhoRfAVAwnxOgEodEKBc';

    const SUBJECT_ICONS = {
      'الرياضيات': '📘',
      'الفيزياء': '⚡',
      'علوم الطبيعة والحياة': '🌿',
      'العلوم التجريبية': '🔬',
      'التقني رياضي': '💻',
      'تسيير واقتصاد': '📊',
      'آداب ولغات': '📖',
      'اللغة العربية': '🕌',
      'اللغة الفرنسية': '🇫🇷',
      'اللغة الإنجليزية': '🇬🇧',
      'الإاريخ والجغرافيا': '🌍',
      'الفلسفة': '🧠',
      'الدين الإسلامي': '📖',
      'الospel': '🎵',
    };
    const SUBJECT_COLORS = [
      'background:rgba(99,102,241,0.1)',
      'background:rgba(16,185,129,0.1)',
      'background:rgba(245,158,11,0.1)',
      'background:rgba(239,68,68,0.1)',
      'background:rgba(168,85,247,0.1)',
      'background:rgba(14,165,233,0.1)',
      'background:rgba(236,72,153,0.1)',
      'background:rgba(34,197,94,0.1)',
    ];

    function getToken() {
      const path = window.location.pathname;
      const match = path.match(/\/s\/(.+)/);
      if (match) return match[1];
      const params = new URLSearchParams(window.location.search);
      return params.get('t') || params.get('token') || params.get('id') || '';
    }

    function showError(title, msg) {
      document.getElementById('app').innerHTML = `
        <div class="error-page">
          <div class="error-icon">🔒</div>
          <div class="error-title">${title}</div>
          <div class="error-msg">${msg}</div>
        </div>`;
    }

    function renderDashboard(r) {
      const fullName = `${r.first_name || ''} ${r.last_name || ''}`.trim();
      const subjects = Array.isArray(r.subjects) ? r.subjects : [];
      const typeLabel = r.student_type === 'حر' ? '🎓 طالب حر' : '📘 طالب متمدرس';
      const streamLabel = r.stream ? ` | ${r.stream}` : '';

      let subjectsHTML = '';
      if (subjects.length === 0) {
        subjectsHTML = `<div class="empty-content"><div class="icon">📭</div>لم تسجل في أي مادة بعد</div>`;
      } else {
        subjectsHTML = subjects.map((s, i) => {
          const icon = SUBJECT_ICONS[s.subject] || '📘';
          const colorStyle = SUBJECT_COLORS[i % SUBJECT_COLORS.length];
          return `
            <div class="subject-card">
              <div class="subject-header">
                <div class="subject-icon" style="${colorStyle}">${icon}</div>
                <div>
                  <div class="subject-name">${s.subject || ''}</div>
                  <div class="subject-teacher">👨‍🏫 ${s.teacher || ''}</div>
                </div>
              </div>
              <div class="subject-actions">
                <button class="subject-btn" disabled style="opacity:0.5;cursor:not-allowed">📚 الدروس <span style="font-size:9px;color:var(--text-muted)">قريباً</span></button>
                <button class="subject-btn" disabled style="opacity:0.5;cursor:not-allowed">📝 التمارين <span style="font-size:9px;color:var(--text-muted)">قريباً</span></button>
              </div>
            </div>`;
        }).join('');
      }

      document.getElementById('app').innerHTML = `
        <div class="portal-header">
          <div class="portal-logo">🎓</div>
          <div class="portal-title">E-PLUS</div>
          <div class="portal-subtitle">بوابة الطالب — برنامج الدعم المدرسي</div>
        </div>
        <div class="welcome-card">
          <div class="welcome-name">مرحباً ${fullName} 👋</div>
          <div class="welcome-id">Student ID: ${r.id || ''}</div>
          <div class="welcome-meta">
            <span class="meta-badge level">📚 ${r.level || ''}</span>
            <span class="meta-badge type">${typeLabel}</span>
            <span class="meta-badge status">✅ مسجل نهائياً</span>
            ${r.institution ? `<span class="meta-badge inst">🏫 ${r.institution}</span>` : ''}
            ${streamLabel ? `<span class="meta-badge level">${streamLabel}</span>` : ''}
          </div>
        </div>
        <div class="subjects-grid">
          <div class="section-label">📚 موادك المسجلة (${subjects.length})</div>
          ${subjectsHTML}
        </div>
        <div class="portal-footer">E-PLUS — أكاديمية التعليم والدعم المدرسي</div>`;
    }

    async function init() {
      const token = getToken();
      if (!token) {
        showError('رابط غير صالح', 'الرجاء استخدام الرابط الموجود على بطاقة التسجيل الخاصة بك.');
        return;
      }

      try {
        const res = await fetch(`${SP_URL}/rest/v1/registrations?select=*&student_token=eq.${encodeURIComponent(token)}&limit=1`, {
          headers: {
            'Content-Type': 'application/json',
            'apikey': SP_KEY,
            'Authorization': `Bearer ${SP_KEY}`,
          },
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        if (!data || data.length === 0) {
          showError('طالب غير موجود', 'لم يتم العثور على تسجيل مرتبط بهذا الرابط. تأكد من صحة الرابط.');
          return;
        }

        const r = data[0];

        if (r.status !== 'مسجل نهائياً') {
          showError('بطاقة غير صالحة', 'لا يمكن استخدام هذه البطاقة قبل تأكيد التسجيل النهائي من إدارة المركز. الرجاء مراجعة المركز لتأكيد تسجيلك.');
          return;
        }

        renderDashboard(r);
      } catch (e) {
        console.error('Student portal error:', e);
        showError('خطأ في التحميل', 'حدث خطأ أثناء تحميل البيانات. الرجاء المحاولة لاحقاً.');
      }
    }

    init();
  </script>
</body>
</html>

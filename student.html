  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --primary:#6366f1;--primary-dark:#4f46e5;--primary-darker:#3730a3;--primary-light:rgba(99,102,241,0.08);--primary-medium:rgba(99,102,241,0.15);
      --gold:#c8a84b;--gold-dark:#b09030;--gold-light:rgba(200,168,75,0.1);
      --bg:#f0f2f5;--card:#ffffff;--card-hover:#fafbfd;
      --text:#1e293b;--text-secondary:#475569;--text-muted:#94a3b8;
      --border:#e2e8f0;--border-light:#f1f5f9;
      --success:#059669;--success-light:rgba(16,185,129,0.1);
      --warning:#d97706;--warning-light:rgba(217,119,6,0.1);
      --danger:#dc2626;--danger-light:rgba(220,38,38,0.08);
      --blue:#0ea5e9;--blue-light:rgba(14,165,233,0.08);
      --sidebar-w:260px;
      --radius:14px;--radius-sm:10px;--radius-xs:8px;
      --shadow:0 1px 3px rgba(0,0,0,0.04),0 4px 12px rgba(0,0,0,0.04);
      --shadow-md:0 4px 16px rgba(0,0,0,0.06);
      --shadow-lg:0 8px 32px rgba(0,0,0,0.08);
      --transition:0.3s cubic-bezier(0.4,0,0.2,1);
    }
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    a{text-decoration:none;color:inherit}
    button{font-family:'Tajawal',sans-serif;cursor:pointer;border:none}

    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scaleIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bgZoom{from{transform:scale(1.05)}to{transform:scale(1.12)}}
    @keyframes slideInDrawer{from{transform:translateX(100%)}to{transform:translateX(0)}}
    @keyframes slideOutDrawer{from{transform:translateX(0)}to{transform:translateX(100%)}}

    /* ═══ LOGIN ═══ */
    .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#1a1a2e}
    .login-bg{position:absolute;inset:0;background:url('images/studentportalbackground.jpg') center/cover no-repeat;animation:bgZoom 20s ease-in-out infinite alternate;z-index:0}
    .login-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(99,102,241,0.85),rgba(55,48,163,0.9));z-index:1;backdrop-filter:blur(2px)}
    .login-shapes{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
    .login-shape{position:absolute;border-radius:50%;background:rgba(255,255,255,0.04)}
    .login-shape:nth-child(1){width:300px;height:300px;top:-80px;right:-60px;animation:float 6s ease-in-out infinite}
    .login-shape:nth-child(2){width:200px;height:200px;bottom:-40px;left:-40px;animation:float 8s ease-in-out infinite 1s}
    .login-shape:nth-child(3){width:120px;height:120px;top:40%;left:10%;animation:float 7s ease-in-out infinite 2s}
    .login-card{background:rgba(255,255,255,0.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.18);border-radius:24px;padding:44px 36px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.3);position:relative;z-index:2;text-align:center;animation:fadeSlideUp 0.7s ease both}
    .login-logo-img{max-width:200px;height:auto;margin:0 auto 32px;display:block;animation:scaleIn 0.6s ease both 0.1s;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.15))}
    .login-field{margin-bottom:18px;text-align:right}
    .login-label{display:block;font-size:13px;font-weight:700;color:rgba(255,255,255,0.8);margin-bottom:8px}
    .login-input{width:100%;padding:14px 16px 14px 48px;border:1.5px solid rgba(255,255,255,0.15);border-radius:var(--radius-sm);font-size:15px;font-weight:700;font-family:'Tajawal',sans-serif;color:#fff;background:rgba(255,255,255,0.08);transition:var(--transition);direction:ltr;text-align:left}
    .login-input::placeholder{color:rgba(255,255,255,0.35)}
    .login-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,168,75,0.2);background:rgba(255,255,255,0.12)}
    .login-input-wrap{position:relative}
    .login-input-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:18px;opacity:0.5;pointer-events:none}
    .login-btn{width:100%;padding:15px;border:none;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--gold),#e2c46a);color:#1a1a2e;font-size:16px;font-weight:900;cursor:pointer;transition:var(--transition);margin-top:8px;box-shadow:0 4px 16px rgba(200,168,75,0.3)}
    .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(200,168,75,0.4)}
    .login-btn:active{transform:translateY(0)}
    .login-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
    .login-error{background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.3);color:#fca5a5;border-radius:var(--radius-xs);padding:12px 14px;font-size:13px;font-weight:700;margin-top:14px;display:none;backdrop-filter:blur(8px)}
    .login-footer{margin-top:28px;font-size:12px;color:rgba(255,255,255,0.4);font-weight:600}

    /* ═══ PORTAL LAYOUT ═══ */
    .portal-layout{display:flex;min-height:100vh}

    /* SIDEBAR */
    .sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#1e1b4b 0%,#312e81 50%,#3730a3 100%);color:#fff;position:fixed;top:0;right:0;bottom:0;z-index:100;display:flex;flex-direction:column;overflow-y:auto;transition:var(--transition)}
    .sidebar::-webkit-scrollbar{width:0}
    .sidebar-brand{padding:28px 24px 20px;border-bottom:1px solid rgba(255,255,255,0.08)}
    .sidebar-brand-row{display:flex;align-items:center;gap:14px}
    .sidebar-logo{width:48px;height:48px;background:linear-gradient(135deg,var(--gold),#e2c46a);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;box-shadow:0 4px 16px rgba(200,168,75,0.3);overflow:hidden}
    .sidebar-brand-text{flex:1;min-width:0}
    .sidebar-brand-name{font-size:18px;font-weight:900;letter-spacing:0.5px}
    .sidebar-brand-sub{font-size:11px;color:rgba(255,255,255,0.5);font-weight:600;margin-top:2px}
    .sidebar-student{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.08)}
    .sidebar-student-avatar{width:56px;height:56px;background:linear-gradient(135deg,rgba(255,255,255,0.15),rgba(255,255,255,0.05));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;margin:0 auto 12px;border:2px solid rgba(255,255,255,0.1)}
    .sidebar-student-name{text-align:center;font-size:15px;font-weight:800;margin-bottom:4px}
    .sidebar-student-id{text-align:center;font-size:11px;color:rgba(255,255,255,0.5);font-weight:600;font-family:monospace}
    .sidebar-nav{padding:16px 12px;flex:1}
    .sidebar-link{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-sm);color:rgba(255,255,255,0.7);font-size:14px;font-weight:600;transition:var(--transition);cursor:pointer;margin-bottom:2px}
    .sidebar-link:hover{background:rgba(255,255,255,0.08);color:#fff}
    .sidebar-link.active{background:linear-gradient(135deg,rgba(200,168,75,0.2),rgba(200,168,75,0.1));color:var(--gold);font-weight:700}
    .sidebar-link-icon{width:20px;text-align:center;font-size:16px}
    .sidebar-footer{padding:16px 24px;border-top:1px solid rgba(255,255,255,0.08)}
    .sidebar-logout{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:var(--radius-sm);background:rgba(220,38,38,0.12);border:1px solid rgba(220,38,38,0.2);color:#fca5a5;font-size:13px;font-weight:700;transition:var(--transition)}
    .sidebar-logout:hover{background:rgba(220,38,38,0.2);border-color:rgba(220,38,38,0.35)}

    /* MAIN */
    .main-content{flex:1;margin-right:var(--sidebar-w);min-height:100vh;padding:0}
    .main-topbar{display:none;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border);align-items:center;gap:12px;position:sticky;top:0;z-index:90}
    .topbar-toggle{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:18px;transition:var(--transition)}
    .topbar-toggle:hover{background:var(--primary-medium)}
    .topbar-brand{display:flex;align-items:center;gap:10px;flex:1}
    .topbar-logo{width:36px;height:36px;background:linear-gradient(135deg,var(--gold),#e2c46a);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
    .topbar-title{font-size:16px;font-weight:900}
    .topbar-logout{padding:8px 14px;border-radius:var(--radius-xs);background:var(--danger-light);color:var(--danger);font-size:12px;font-weight:700;transition:var(--transition)}
    .topbar-logout:hover{background:rgba(220,38,38,0.15)}
    .main-body{padding:32px 28px}

    /* HERO */
    .hero-card{background:linear-gradient(135deg,#6366f1 0%,#4f46e5 40%,#3730a3 100%);border-radius:20px;padding:36px 32px;color:#fff;position:relative;overflow:hidden;margin-bottom:28px;animation:fadeSlideUp 0.5s ease both}
    .hero-card::before{content:'';position:absolute;top:-50%;left:-20%;width:60%;height:200%;background:radial-gradient(circle,rgba(200,168,75,0.12) 0%,transparent 60%);pointer-events:none}
    .hero-row{display:flex;align-items:center;gap:20px;position:relative;z-index:1}
    .hero-avatar{width:68px;height:68px;background:rgba(255,255,255,0.15);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;border:2px solid rgba(255,255,255,0.2);flex-shrink:0}
    .hero-info{flex:1;min-width:0}
    .hero-greeting{font-size:13px;color:rgba(255,255,255,0.6);font-weight:600;margin-bottom:4px}
    .hero-name{font-size:24px;font-weight:900;line-height:1.2}
    .hero-id{font-size:12px;color:rgba(255,255,255,0.5);font-family:monospace;font-weight:600;margin-top:4px}
    .hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:relative;z-index:1}
    .hero-badge{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;backdrop-filter:blur(8px)}
    .hero-badge.level{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.15)}
    .hero-badge.type{background:rgba(200,168,75,0.2);border:1px solid rgba(200,168,75,0.3)}
    .hero-badge.status{background:rgba(16,185,129,0.2);border:1px solid rgba(16,185,129,0.3)}
    .hero-badge.inst{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1)}
    .hero-badge.stream{background:rgba(99,102,241,0.2);border:1px solid rgba(255,255,255,0.15)}

    /* STAT CARDS */
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
    .stat-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border-light);transition:var(--transition);position:relative;overflow:hidden}
    .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
    .stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;border-radius:0 var(--radius) var(--radius) 0}
    .stat-card.c-purple::before{background:var(--primary)}
    .stat-card.c-gold::before{background:var(--gold)}
    .stat-card.c-green::before{background:var(--success)}
    .stat-card.c-blue::before{background:var(--blue)}
    .stat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
    .stat-icon.i-purple{background:var(--primary-light)}
    .stat-icon.i-gold{background:var(--gold-light)}
    .stat-icon.i-green{background:var(--success-light)}
    .stat-icon.i-blue{background:var(--blue-light)}
    .stat-value{font-size:28px;font-weight:900;color:var(--text);line-height:1}
    .stat-label{font-size:12px;color:var(--text-muted);font-weight:600;margin-top:4px}

    /* SUBJECTS */
    .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .section-title{font-size:18px;font-weight:900;color:var(--text);display:flex;align-items:center;gap:8px}
    .section-count{background:var(--primary-light);color:var(--primary);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800}
    .subjects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:32px}
    .subject-card{background:var(--card);border-radius:var(--radius);padding:0;box-shadow:var(--shadow);border:1px solid var(--border-light);transition:var(--transition);overflow:hidden;animation:fadeSlideUp 0.5s ease both}
    .subject-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
    .subject-card-top{padding:20px 20px 0;display:flex;align-items:flex-start;gap:14px}
    .subject-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
    .subject-info{flex:1;min-width:0}
    .subject-name{font-size:16px;font-weight:800;color:var(--text);margin-bottom:3px}
    .subject-teacher{font-size:13px;color:var(--text-muted);font-weight:600;display:flex;align-items:center;gap:4px}
    .subject-progress-wrap{padding:16px 20px 0}
    .subject-progress-bar{height:6px;background:var(--border-light);border-radius:3px;overflow:hidden}
    .subject-progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),#8b5cf6);transition:width 1s ease}
    .subject-progress-text{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;font-weight:600;color:var(--text-muted)}
    .subject-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:16px 0 0;border-top:1px solid var(--border-light)}
    .subject-stat{padding:14px 8px;text-align:center;border-left:1px solid var(--border-light)}
    .subject-stat:last-child{border-left:none}
    .subject-stat-num{font-size:18px;font-weight:900;color:var(--text)}
    .subject-stat-label{font-size:10px;color:var(--text-muted);font-weight:700;margin-top:2px}
    .subject-card-footer{padding:12px 20px 16px;display:flex;gap:8px}
    .subject-btn{flex:1;padding:10px;border-radius:var(--radius-xs);border:1.5px solid var(--border);background:var(--card);color:var(--text-secondary);font-size:12px;font-weight:700;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:'Tajawal',sans-serif}
    .subject-btn:hover{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
    .subject-btn.disabled{opacity:0.45;cursor:not-allowed;pointer-events:none}

    .portal-footer{text-align:center;padding:24px;font-size:12px;color:var(--text-muted);font-weight:600}

    /* ═══ CARD PAGE (3D FLIP) ═══ */
    .card-page-wrap{display:flex;flex-direction:column;align-items:center;animation:fadeSlideUp 0.5s ease both}
    .card-flip-switch{display:flex;align-items:center;gap:16px;margin-bottom:28px;background:var(--card);border-radius:50px;padding:6px;box-shadow:var(--shadow);border:1px solid var(--border-light)}
    .card-flip-option{padding:10px 24px;border-radius:50px;font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;transition:var(--transition);user-select:none;white-space:nowrap}
    .card-flip-option.active{background:linear-gradient(135deg,var(--primary),#8b5cf6);color:#fff;box-shadow:0 2px 12px rgba(99,102,241,0.3)}
    .card-flip-option:not(.active):hover{color:var(--text)}
    .card-flip-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:var(--transition)}
    .card-flip-dot.active{background:var(--primary)}

    .card-scene{perspective:1200px;width:380px;height:228px;cursor:pointer}
    .card-3d{width:100%;height:100%;position:relative;transition:transform 0.7s cubic-bezier(0.4,0,0.2,1);transform-style:preserve-3d}
    .card-3d.flipped{transform:rotateY(180deg)}
    .card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.18)}
    .card-front{z-index:2}
    .card-back{transform:rotateY(180deg);z-index:1}
    .card-face img{width:100%;height:100%;object-fit:cover;display:block}
    .card-front-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:12px}
    .card-info-hint{text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted);font-weight:600}

    /* ═══ LOADING / ERROR ═══ */
    .loading-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px}
    .spinner{width:44px;height:44px;border:3.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
    .loading-text{font-size:15px;color:var(--text-muted);font-weight:600}
    .error-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center}
    .error-icon{font-size:64px;margin-bottom:16px}
    .error-title{font-size:22px;font-weight:900;color:var(--text);margin-bottom:8px}
    .error-msg{font-size:14px;color:var(--text-muted);max-width:400px;line-height:1.7}

    /* ═══ DRAWER ═══ */
    .drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;opacity:0;transition:opacity 0.3s ease;backdrop-filter:blur(2px)}
    .drawer-overlay.open{display:block;opacity:1}

    /* ═══ SUBSCRIPTION (شفافية الاشتراك الشهري) ═══ */
    .sub-panel{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);border:1px solid var(--border-light);margin-bottom:28px;animation:fadeSlideUp 0.5s ease both 0.3s}
    .sub-panel .section-title{font-size:17px}
    .sub-badge-st{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:800}
    .sub-badge-st.ok{background:var(--success-light);color:var(--success)}
    .sub-badge-st.no{background:var(--warning-light);color:var(--warning)}
    .sub-badge-st.full{background:var(--danger-light);color:var(--danger)}
    .sub-badge-st.paused{background:rgba(147,51,234,0.14);color:#7c3aed}
    .sub-status-line{font-size:13px;color:var(--text-muted);font-weight:600;margin-top:4px}
    .sub-month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:16px}
    .sub-month-card{background:var(--bg);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:var(--transition)}
    .sub-month-card:hover{border-color:var(--primary);box-shadow:var(--shadow-md)}
    .sub-month-card.active{border-color:var(--primary);background:var(--primary-light)}
    .sub-month-head{display:flex;align-items:center;gap:10px}

    async function loadStudentSubscription(studentId){
      const badge=document.getElementById('student-sub-badge');
      const content=document.getElementById('student-sub-content');
      if(!badge||!content)return;

      let data=null;
      try{data=await SubscriptionService.getActiveSubscription(studentId);}catch(e){console.warn('sub load failed',e);}

      if(!data||!data.subscription){
        badge.textContent='لا يوجد اشتراك';

        content.innerHTML='<div class="sub-status-line">لا يوجد اشتراك نشط لهذا الحساب حالياً — يمكنك متابعة المواد، وللاطلاع على تفاصيل حصصك الشهرية يرجى التواصل مع إدارة المركز.</div>';
        return;
      }

      const today=SubscriptionService.today();
      const periods=data.periods||[];
      const activePeriod=SubscriptionService.activePeriod(periods,today)||null;

      let events=[];
      try{events=await fetchStudentAttendance(studentId);}catch(e){}
      const inRange=(ev,p)=>ev&&ev.date&&p&&ev.date>=p.start_date&&ev.date<=p.end_date;

      const totalEvents=events.length;
      const monthEvents=periods.map(p=>events.filter(ev=>inRange(ev,p)));

      let activeCount=0,revenueNote='';
      periods.forEach(p=>{if(today>=p.start_date&&today<=p.end_date)activeCount++;});

      const statusOk=!!activePeriod;
      const activeUsed=activePeriod?(activePeriod.used_sessions||0):0;
      const activeTotal=activePeriod?(activePeriod.total_sessions||SubscriptionService.SESSIONS_PER_MONTH):0;
      const activeRemain=Math.max(0,activeTotal-activeUsed);

      const pausedSub=(data.subscription.status==='paused');
      if(pausedSub){
        badge.textContent='⏸️ متوقف مؤقتاً';
        badge.className='sub-badge-st paused';
      }else if(statusOk){
        badge.textContent=activeRemain>0?'اشتراك نشط':'اكتملت حصص الشهر';
        badge.className='sub-badge-st '+(activeRemain>0?'ok':'full');
      }else{
        badge.textContent='انتهى الاشتراك';
        badge.className='sub-badge-st no';
      }

      let monthsHTML=periods.map((p,i)=>{
        const used=p.used_sessions||0;
        const total=p.total_sessions||SubscriptionService.SESSIONS_PER_MONTH;
        const remain=Math.max(0,total-used);
        const pct=total?Math.round((used/total)*100):0;
        const isActive=activePeriod&&activePeriod.id===p.id;
        const ms=SubscriptionService.monthStatus(p,today);
        const msTxt=SubscriptionService.monthStatusLabel(ms);
        const msBg=ms==='active'?'background:rgba(16,185,129,0.14);color:#10b981':ms==='upcoming'?'background:rgba(148,163,184,0.16);color:#64748b':ms==='full'?'background:rgba(239,68,68,0.14);color:#ef4444':ms==='expired_remain'?'background:rgba(245,158,11,0.14);color:#d97706':'background:rgba(99,102,241,0.14);color:#6366f1';
        const evs=monthEvents[i]||[];
        let evHTML='';
        if(!evs.length)evHTML='<div class="sub-empty-msg">لا توجد حصص مسجلة في هذا الشهر</div>';
        else evHTML='<div class="sub-ev-list">'+evs.slice(0,20).map(ev=>
          '<div class="sub-ev"><div class="sub-ev-dot"></div><div class="sub-ev-main"><div class="sub-ev-subj">'+subEsc(ev.subjectName||'—')+'</div><div class="sub-ev-teach">'+subEsc(ev.teacherName||'—')+'</div></div><div class="sub-ev-date">'+subFmtAr(ev.date)+' — '+subEsc(ev.checkInTime||ev.time||'—')+'</div></div>'
        ).join('')+'</div>'+(evs.length>20?'<div class="sub-empty-msg">و '+ (evs.length-20) +' حصص أخرى…</div>':'');
        return '<div class="sub-month-card'+(isActive?' active':'')+'" onclick="this.classList.toggle(\'open\')">'+
          '<div class="sub-month-head"><div class="sub-month-idx">'+(p.month_number||(i+1))+'</div>'+
          '<div class="sub-month-main"><div class="sub-month-name">الشهر '+(p.month_number||(i+1))+(isActive?' — الحالي':'')+'</div>'+
          '<div class="sub-month-range">'+subFmtAr(p.start_date)+' → '+subFmtAr(p.end_date)+'</div>'+
          '<div class="sub-month-status" style="'+msBg+'">'+msTxt+'</div></div>'+
          '<div class="sub-month-usage">حضر <span class="u">'+used+'</span> · متبقي <span class="r">'+remain+'</span> / '+total+'</div></div>'+
          '<div class="sub-month-progress"><i style="width:'+pct+'%"></i></div>'+
          '<div class="sub-month-detail">'+evHTML+'</div></div>';
      }).join('');

      let statusLine;
      if(pausedSub){
        statusLine='⏸️ اشتراكك متوقف مؤقتاً — لن يُسجَّل أي حضور حتى يستأنفه الإدارة.';
      }else if(statusOk){
        statusLine='الاشتراك ساري — الشهر الحالي: <b>'+subFmtAr(activePeriod.start_date)+' → '+subFmtAr(activePeriod.end_date)+'</b>.'+(activeRemain>0?' يمكنك حضور '+activeRemain+' حصة متبقية.':' تم استهلاك كل حصص هذا الشهر.');
      }else{
        statusLine='انتهى الاشتراك — لا يمكن تسجيل حضور جديد حتى التجديد لدى الإدارة.';
      }

      content.innerHTML=
        '<div class="sub-status-line">'+statusLine+'</div>'+
        '<div class="sub-summary">'+
          '<div class="sub-sum-card"><span class="k">عدد الأشهر</span><span class="v">'+(data.subscription.months||periods.length)+'</span></div>'+
          '<div class="sub-sum-card"><span class="k">إجمالي الحصص</span><span class="v">'+(data.subscription.total_sessions||periods.reduce((a,p)=>a+(p.total_sessions||0),0))+'</span></div>'+
          '<div class="sub-sum-card"><span class="k">حضور الشهر الحالي</span><span class="v u">'+(statusOk?activeUsed:0)+'</span></div>'+
          '<div class="sub-sum-card"><span class="k">متبقي الشهر الحالي</span><span class="v r">'+(statusOk?activeRemain:0)+'</span></div>'+
        '</div>'+
        '<div class="sub-month-grid">'+monthsHTML+'</div>';
    }

      const errEl=document.getElementById('login-error');
      const btn=document.getElementById('login-btn');
      if(!id||!phone){errEl.textContent='الرجاء ملء جميع الحقول';errEl.style.display='block';return;}
      btn.disabled=true;btn.textContent='جاري التحقق...';errEl.style.display='none';
      try{
        const res=await fetch(SP_URL+'/rest/v1/registrations?select=*&id=eq.'+encodeURIComponent(id)+'&parent_phone=eq.'+encodeURIComponent(phone)+'&limit=1',{headers:{'Content-Type':'application/json','apikey':SP_KEY,'Authorization':'Bearer '+SP_KEY}});
        if(!res.ok)throw new Error('HTTP '+res.status);
        const data=await res.json();
        if(!data||data.length===0){errEl.textContent='رقم التسجيل أو هاتف ولي الأمر غير صحيح. الرجاء المحاولة مرة أخرى.';errEl.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول ✦';return;}
        const r=data[0];
        if(r.deleted_at){errEl.textContent='هذا التسجيل تم حذفه من طرف الإدارة.';errEl.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول ✦';return;}
        if(r.status!=='مسجل نهائياً'){errEl.textContent='لا يمكن استخدام بوابة الطالب قبل تأكيد التسجيل النهائي من إدارة المركز.';errEl.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول ✦';return;}
        saveSession(r);renderDashboard(r);
      }catch(err){console.error('Login error:',err);errEl.textContent='حدث خطأ أثناء التحقق. الرجاء المحاولة لاحقاً.';errEl.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول ✦';}
    }

    /* ═══ SIDEBAR ═══ */
    function renderSidebar(r){
      const fullName=(r.first_name||'')+' '+(r.last_name||'');
      const initials=(r.first_name?r.first_name[0]:'')+(r.last_name?r.last_name[0]:'');
      return `
        <div class="sidebar-brand"><div class="sidebar-brand-row"><div class="sidebar-logo"><img src="icons/logospiring.png" alt="Logo" style="width:100%;height:100%;object-fit:contain;border-radius:8px"></div><div class="sidebar-brand-text"><div class="sidebar-brand-name">E-PLUS</div><div class="sidebar-brand-sub">Student Portal</div></div></div></div>
        <div class="sidebar-student"><div class="sidebar-student-avatar">${initials}</div><div class="sidebar-student-name">${fullName}</div><div class="sidebar-student-id">ID: ${r.id||''}</div></div>
        <div class="sidebar-nav">
          <div class="sidebar-link ${currentPage==='home'?'active':''}" onclick="navigateTo('home')"><span class="sidebar-link-icon">🏠</span>الرئيسية</div>
          <div class="sidebar-link ${currentPage==='content'?'active':''}" onclick="navigateTo('content')"><span class="sidebar-link-icon">📚</span>المحتوى التعليمي</div>
          <div class="sidebar-link ${currentPage==='card'?'active':''}" onclick="navigateTo('card')"><span class="sidebar-link-icon">💳</span>بطاقتي</div>
        </div>
        <div class="sidebar-footer">
          <a href="/" style="display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;color:rgba(255,255,255,0.7);text-decoration:none;font-size:13px;font-weight:600;transition:all .25s;margin-bottom:8px;border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05)" onmouseover="this.style.background='rgba(255,255,255,0.12)';this.style.color='#fff'" onmouseout="this.style.background='rgba(255,255,255,0.05)';this.style.color='rgba(255,255,255,0.7)'"><span style="font-size:16px">🏠</span>العودة للصفحة الرئيسية</a>
          <button class="sidebar-logout" onclick="handleLogout()">🚪 تسجيل الخروج</button></div>`;
    }

    function navigateTo(page){
      currentPage=page;
      closeDrawer();
      renderCurrentPage();
    }
    function renderCurrentPage(){
      if(!currentStudent)return;
      if(currentPage==='card')renderCardPage(currentStudent);
      else if(currentPage==='content')renderStudentContentPage(currentStudent);
      else renderDashboard(currentStudent);
    }

    /* ═══ MOBILE DRAWER ═══ */
    function openDrawer(){
      document.getElementById('drawer-overlay').classList.add('open');
      let drawer=document.getElementById('mobile-drawer-panel');
      if(!drawer){drawer=document.createElement('div');drawer.id='mobile-drawer-panel';drawer.style.cssText='display:block;position:fixed;top:0;right:0;bottom:0;width:280px;background:linear-gradient(180deg,#1e1b4b 0%,#312e81 50%,#3730a3 100%);color:#fff;z-index:201;overflow-y:auto;animation:slideInDrawer 0.3s ease both;box-shadow:-4px 0 24px rgba(0,0,0,0.3)';document.body.appendChild(drawer);}
      drawer.innerHTML=renderSidebar(currentStudent);drawer.style.display='block';drawer.style.animation='slideInDrawer 0.3s ease both';
    }
    function closeDrawer(){
      document.getElementById('drawer-overlay').classList.remove('open');
      const drawer=document.getElementById('mobile-drawer-panel');
      if(drawer){drawer.style.animation='slideOutDrawer 0.3s ease both';setTimeout(()=>{drawer.style.display='none';},280);}
    }

    /* ═══ DASHBOARD PAGE ═══ */
    function renderDashboard(r){
      currentStudent=r;currentPage='home';
      const fullName=(r.first_name||'')+' '+(r.last_name||'');
      const subjects=Array.isArray(r.subjects)?r.subjects:[];
      const typeLabel=r.student_type==='حر'?'🎓 طالب حر':'📘 طالب متمدرس';
      const initials=(r.first_name?r.first_name[0]:'')+(r.last_name?r.last_name[0]:'');
      const streamText=r.stream?' | '+r.stream:'';

      let subjectsHTML=subjects.length===0?'<div style="text-align:center;padding:48px 20px;color:var(--text-muted);font-size:14px;grid-column:1/-1"><div style="font-size:48px;margin-bottom:12px">📭</div><div style="font-weight:700">لم تسجل في أي مادة بعد</div></div>':
        subjects.map((s,i)=>{const icon=SUBJECT_ICONS[s.subject]||'📘';const color=SUBJECT_COLORS[i%SUBJECT_COLORS.length];return `<div class="subject-card" style="animation-delay:${i*0.08}s"><div class="subject-card-top"><div class="subject-icon" style="background:${color}">${icon}</div><div class="subject-info"><div class="subject-name">${s.subject||''}</div><div class="subject-teacher">👨‍🏫 ${s.teacher||''}</div></div></div><div class="subject-progress-wrap"><div class="subject-progress-bar"><div class="subject-progress-fill" style="width:0%"></div></div><div class="subject-progress-text"><span>تقدمك</span><span>قريباً</span></div></div><div class="subject-stats"><div class="subject-stat"><div class="subject-stat-num">—</div><div class="subject-stat-label">الدروس</div></div><div class="subject-stat"><div class="subject-stat-num">—</div><div class="subject-stat-label">التمارين</div></div><div class="subject-stat"><div class="subject-stat-num">—</div><div class="subject-stat-label">آخر تحديث</div></div></div><div class="subject-card-footer"><button class="subject-btn" onclick="navigateTo('content')" style="cursor:pointer">📚 عرض المحتوى</button><button class="subject-btn disabled" disabled>📝 التمارين <span style="font-size:9px;color:var(--text-muted);margin-right:2px">قريباً</span></button></div></div>`;}).join('');

      document.getElementById('app').innerHTML=`
        <div class="portal-layout">
          <aside class="sidebar">${renderSidebar(r)}</aside>
          <div class="main-content">
            <div class="main-topbar"><button class="topbar-toggle" onclick="openDrawer()">☰</button><div class="topbar-brand"><div class="topbar-logo"><img src="icons/logospiring.png" alt="Logo" style="width:100%;height:100%;object-fit:contain;border-radius:8px"></div><div class="topbar-title">E-PLUS</div></div><button class="topbar-logout" onclick="handleLogout()">🚪 خروج</button></div>
            <div class="main-body">
              <div class="hero-card"><div class="hero-row"><div class="hero-avatar"><img src="icons/student.png" alt="${fullName}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit"></div><div class="hero-info"><div class="hero-greeting">مرحباً بك 👋</div><div class="hero-name">${fullName}</div><div class="hero-id">Student ID: ${r.id||''}</div></div></div><div class="hero-badges"><span class="hero-badge level">📚 ${r.level||''}</span><span class="hero-badge type">${typeLabel}</span><span class="hero-badge status">✅ مسجل نهائياً</span>${r.institution?`<span class="hero-badge inst">🏫 ${r.institution}</span>`:''}${streamText?`<span class="hero-badge stream">${streamText}</span>`:''}</div></div>
              <div class="stats-grid">
                <div class="stat-card c-purple" style="animation:fadeSlideUp 0.5s ease both 0.1s"><div class="stat-icon i-purple">📚</div><div class="stat-value">${subjects.length}</div><div class="stat-label">مادة مسجلة</div></div>
                <div class="stat-card c-gold" style="animation:fadeSlideUp 0.5s ease both 0.15s"><div class="stat-icon i-gold">📖</div><div class="stat-value">—</div><div class="stat-label">عدد الدروس</div></div>
                <div class="stat-card c-green" style="animation:fadeSlideUp 0.5s ease both 0.2s"><div class="stat-icon i-green">📝</div><div class="stat-value">—</div><div class="stat-label">عدد التمارين</div></div>
                <div class="stat-card c-blue" style="animation:fadeSlideUp 0.5s ease both 0.25s"><div class="stat-icon i-blue">🕐</div><div class="stat-value" style="font-size:14px;font-weight:700;color:var(--text-muted)">قريباً</div><div class="stat-label">آخر نشاط</div></div>
              </div>
              <div class="sub-panel">
                <div class="section-title" style="margin-bottom:6px">📅 اشتراكي الشهري</div>
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="sub-badge-st" id="student-sub-badge">—</span></div>
                <div id="student-sub-content"><div class="sub-status-line">جاري تحميل الاشتراك…</div></div>
              </div>
              <div id="stu-content-preview" style="margin-bottom:28px"></div>
              <div class="section-header"><div class="section-title">📚 موادك المسجلة</div><div class="section-count">${subjects.length} مادة</div></div>
              <div class="subjects-grid">${subjectsHTML}</div>
              <div class="portal-footer">E-PLUS — أكاديمية التعليم والدعم المدرسي © 2025</div>
            </div>
          </div>
        </div>`;
      updateSidebarActive();document.body.style.overflow='auto';
      loadStudentSubscription(r.id);
      var subNames=subjects.map(function(s){return s.subject||'';}).filter(Boolean);
      loadStudentContentPreview(subNames);
    }

    /* ═══ CARD PAGE (3D FLIP) ═══ */
    function renderCardPage(r){
      currentStudent=r;currentPage='card';
      const faces=StudentCardRenderer.portalFaces(r);

      document.getElementById('app').innerHTML=`
        <div class="portal-layout">
          <aside class="sidebar">${renderSidebar(r)}</aside>
          <div class="main-content">
            <div class="main-topbar"><button class="topbar-toggle" onclick="openDrawer()">☰</button><div class="topbar-brand"><div class="topbar-logo"><img src="icons/logospiring.png" alt="Logo" style="width:100%;height:100%;object-fit:contain;border-radius:8px"></div><div class="topbar-title">E-PLUS</div></div><button class="topbar-logout" onclick="handleLogout()">🚪 خروج</button></div>
            <div class="main-body">
              <div class="card-page-wrap">
                <div class="section-title" style="margin-bottom:24px">🪪 بطاقة التسجيل</div>
                <div class="card-flip-switch">
                  <div class="card-flip-option active" id="flip-front-btn" onclick="flipCard(false)">الوجه الأمامي</div>
                  <div class="card-flip-dot" id="flip-dot"></div>
                  <div class="card-flip-option" id="flip-back-btn" onclick="flipCard(true)">الوجه الخلفي</div>
                </div>
                <div class="card-scene" onclick="toggleFlip()" id="card-scene">
                  <div class="card-3d" id="card-3d">
                    <div class="card-face card-front">${faces.front}</div>
                    <div class="card-face card-back">${faces.back}</div>
                  </div>
                </div>
                <div class="card-info-hint">اضغط على البطاقة أو استخدم الزر أعلاه لقلبها</div>
              </div>
              <div class="portal-footer">E-PLUS — أكاديمية التعليم والدعم المدرسي © 2025</div>
            </div>
          </div>
        </div>`;
      updateSidebarActive();
      setTimeout(()=>{StudentCardRenderer.injectCSS(document);StudentCardRenderer.hydrateRoot(document.getElementById('card-scene'),r);},100);
    }

    function toggleFlip(){
      const card=document.getElementById('card-3d');
      if(!card)return;
      const isFlipped=card.classList.toggle('flipped');
      updateFlipSwitch(isFlipped);
    }
    function flipCard(toBack){
      const card=document.getElementById('card-3d');
      if(!card)return;
      if(toBack)card.classList.add('flipped');else card.classList.remove('flipped');
      updateFlipSwitch(toBack);
    }
    function updateFlipSwitch(isBack){
      const fBtn=document.getElementById('flip-front-btn');
      const bBtn=document.getElementById('flip-back-btn');
      const dot=document.getElementById('flip-dot');
      if(!fBtn)return;
      if(isBack){fBtn.classList.remove('active');bBtn.classList.add('active');dot.classList.add('active');}
      else{fBtn.classList.add('active');bBtn.classList.remove('active');dot.classList.remove('active');}
    }

    function updateSidebarActive(){
      document.querySelectorAll('.sidebar-link').forEach(l=>{
        l.classList.remove('active');
        if(currentPage==='home'&&l.textContent.includes('الرئيسية'))l.classList.add('active');
        if(currentPage==='card'&&l.textContent.includes('بطاقتي'))l.classList.add('active');
        if(currentPage==='content'&&l.textContent.includes('المحتوى'))l.classList.add('active');
      });
    }

    /* ═══ CONTENT PAGE ═══ */
    const STU_TYPE_LABELS={lesson:'📚 درس',exercise:'📝 تمارين',homework:'📋 واجبات',announcement:'📢 إعلان'};
    const STU_TYPE_COLORS={lesson:'blue',exercise:'green',homework:'gold',announcement:'purple'};

    async function renderStudentContentPage(r){
      currentStudent=r;currentPage='content';
      var stuSubjects=Array.isArray(r.subjects)?r.subjects:[];
      var subjectNames=stuSubjects.map(function(s){return typeof s==='string'?s:(s.subject||'');}).filter(Boolean);
      document.getElementById('app').innerHTML=`
        <div class="portal-layout">
          <aside class="sidebar">${renderSidebar(r)}</aside>
          <div class="main-content">
            <div class="main-topbar"><button class="topbar-toggle" onclick="openDrawer()">☰</button><div class="topbar-brand"><div class="topbar-logo"><img src="icons/logospiring.png" alt="Logo" style="width:100%;height:100%;object-fit:contain;border-radius:8px"></div><div class="topbar-title">E-PLUS</div></div><button class="topbar-logout" onclick="handleLogout()">🚪 خروج</button></div>
            <div class="main-body">
              <div class="section-header"><div class="section-title">📚 المحتوى التعليمي</div><div class="section-count" id="stu-content-count">...</div></div>
              <div id="stu-content-list"><div class="loading-page" style="min-height:200px"><div class="spinner"></div></div></div>
              <div class="portal-footer">E-PLUS — أكاديمية التعليم والدعم المدرسي © 2025</div>
            </div>
          </div>
        </div>`;
      updateSidebarActive();
      try{
        var snap=await window._fdb.collection('teacher_content').get();
        var items=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
        if(subjectNames.length>0){
          items=items.filter(function(c){return subjectNames.indexOf(c.subject)>=0;});
        }
        items=items.sort(function(a,b){return (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0);});
        var countEl=document.getElementById('stu-content-count');
        if(countEl)countEl.textContent=items.length+' محتوى';
        var listEl=document.getElementById('stu-content-list');
        if(items.length===0){
          listEl.innerHTML='<div style="text-align:center;padding:48px 20px;color:var(--text-muted)"><div style="font-size:56px;margin-bottom:16px;opacity:.3">📭</div><div style="font-size:16px;font-weight:800;color:var(--text);margin-bottom:8px">لا يوجد محتوى بعد</div><div style="font-size:13px;max-width:320px;margin:0 auto;line-height:1.7">لم يُضف أي محتوى تعليمي بعد — سيتم عرض الدروس والتمارين هنا فور نشرها</div></div>';
          return;
        }
        var grouped={};
        var teacherOrder=[];
        items.forEach(function(c){
          var tn=c.teacherName||'غير محدد';
          if(!grouped[tn]){grouped[tn]=[];teacherOrder.push(tn);}
          grouped[tn].push(c);
        });
        var html='';
        teacherOrder.forEach(function(tn){
          var tItems=grouped[tn];
          html+='<div style="margin-bottom:28px">';
          html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--border)"><div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:900">'+tn.charAt(0)+'</div><div><div style="font-size:14px;font-weight:900;color:var(--text)">الأستاذ: '+tn+'</div><div style="font-size:11px;color:var(--text-muted);font-weight:600">'+tItems.length+' محتوى</div></div></div>';
          html+='<div class="stu-content-grid">';
          tItems.forEach(function(c,i){
            var tc=STU_TYPE_COLORS[c.type]||'blue',tl=STU_TYPE_LABELS[c.type]||c.type;
            var hasFiles=c.attachments&&c.attachments.length>0;
            var hasUrl=c.url&&c.url.trim();
            var createdAt=c.createdAt?(c.createdAt.seconds?new Date(c.createdAt.seconds*1000):new Date(c.createdAt)):null;
            var dateStr=createdAt?createdAt.toLocaleDateString('ar-DZ',{year:'numeric',month:'short',day:'numeric'}):'';
            html+=`<div class="stu-content-card" style="animation-delay:${i*0.06}s">
              <div class="stu-content-card-header">
                <div class="stu-content-card-icon ${c.type}">${tl.split(' ')[0]}</div>
                <div style="flex:1;min-width:0">
                  <div class="stu-content-card-title">${c.title||'بدون عنوان'}</div>
                  <div class="stu-content-card-meta"><span>${c.subject||''}</span>${c.level?'<span>— '+c.level+'</span>':''}<span style="opacity:.5">·</span><span>${dateStr}</span></div>
                </div>
              </div>
              ${c.description?'<div class="stu-content-card-body">'+c.description+'</div>':''}
              <div class="stu-content-card-footer">
                <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
                  <span class="stu-content-tag" style="background:var(--${tc}-light);color:var(--${tc})">${tl}</span>
                  ${hasFiles?'<a class="stu-content-attach" href="'+(c.attachments[0].url||'#')+'" target="_blank" rel="noopener">📎 '+c.attachments.length+' مرفق</a>':''}
                  ${hasUrl?'<a class="stu-content-url" href="'+c.url+'" target="_blank" rel="noopener">🔗 رابط</a>':''}
                </div>
                ${hasFiles&&c.attachments.length>1?'<div style="font-size:10px;color:var(--text-muted);font-weight:600">'+c.attachments.length+' ملفات</div>':''}
              </div>
            </div>`;
          });
          html+='</div></div>';
        });
        listEl.innerHTML=html;
      }catch(e){
        console.error('[StudentContent] Error:',e);
        document.getElementById('stu-content-list').innerHTML='<div style="text-align:center;padding:40px 20px"><div style="font-size:40px;margin-bottom:12px">⚠️</div><div style="font-size:14px;font-weight:800;color:var(--text)">حدث خطأ أثناء تحميل المحتوى</div><div style="font-size:12px;color:var(--text-muted);margin-top:8px">'+e.message+'</div></div>';
      }
    }

    function handleLogout(){clearSession();window.location.href='/student.html';}

    async function init(){
      const urlToken=getTokenFromURL();
      if(urlToken){
        showLoading();
        try{const res=await fetch(SP_URL+'/rest/v1/registrations?select=*&student_token=eq.'+encodeURIComponent(urlToken)+'&limit=1',{headers:{'Content-Type':'application/json','apikey':SP_KEY,'Authorization':'Bearer '+SP_KEY}});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!data||data.length===0){showError('طالب غير موجود','لم يتم العثور على تسجيل مرتبط بهذا الرابط.');return;}const r=data[0];if(r.status!=='مسجل نهائياً'){showError('بطاقة غير صالحة','لا يمكن استخدام هذه البطاقة قبل تأكيد التسجيل النهائي من إدارة المركز.');return;}saveSession(r);renderDashboard(r);}catch(e){console.error('Portal error:',e);showError('خطأ في التحميل','حدث خطأ أثناء تحميل البيانات. الرجاء المحاولة لاحقاً.');}
        return;
      }
      const session=getSession();
      if(session){
        showLoading();
        try{const res=await fetch(SP_URL+'/rest/v1/registrations?select=*&id=eq.'+encodeURIComponent(session.id)+'&limit=1',{headers:{'Content-Type':'application/json','apikey':SP_KEY,'Authorization':'Bearer '+SP_KEY}});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!data||data.length===0){clearSession();showLogin('الطالب غير موجود في النظام.');return;}const r=data[0];if(r.status!=='مسجل نهائياً'){clearSession();showLogin('لم يتم تأكيد تسجيلك النهائي بعد.');return;}renderDashboard(r);}catch(e){console.error('Session restore error:',e);clearSession();showLogin('حدث خطأ أثناء تحميل البيانات.');}
        return;
      }
      showLogin();
    }
    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الطالب — E-PLUS</title>
  <link rel="icon" type="image/x-icon" href="images/eplus-icon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--primary:#6366f1;--primary-dark:#4f46e5;--primary-light:rgba(99,102,241,0.08);--gold:#c8a84b;--gold-dark:#b09030;--gold-light:rgba(200,168,75,0.1);--bg:#f0f2f5;--card:#ffffff;--text:#1e293b;--text-muted:#64748b;--border:#e2e8f0;--success:#059669;--success-light:rgba(16,185,129,0.1);--warning:#d97706;--danger:#dc2626;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,0.06)}
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    a{text-decoration:none;color:inherit}
    button{font-family:'Tajawal',sans-serif;cursor:pointer}

    /* ═══ LOGIN PAGE ═══ */
    .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1 0%,#4f46e5 50%,#3730a3 100%);padding:20px;position:relative;overflow:hidden}
    .login-page::before{content:'';position:absolute;top:-50%;right:-50%;width:100%;height:100%;background:radial-gradient(circle,rgba(200,168,75,0.1) 0%,transparent 60%);animation:loginPulse 8s ease-in-out infinite alternate}
    @keyframes loginPulse{from{transform:scale(1)}to{transform:scale(1.2)}}
    .login-card{background:var(--card);border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.2);position:relative;z-index:1;text-align:center}
    .login-logo{width:72px;height:72px;background:var(--primary-light);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:12px;border:2px solid rgba(99,102,241,0.15)}
    .login-title{font-size:24px;font-weight:900;color:var(--text);margin-bottom:4px}
    .login-subtitle{font-size:13px;color:var(--text-muted);font-weight:600;margin-bottom:28px}
    .login-field{margin-bottom:16px;text-align:right}
    .login-label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px}
    .login-input{width:100%;padding:12px 16px 12px 44px;border:2px solid var(--border);border-radius:12px;font-size:15px;font-weight:700;font-family:'Tajawal',sans-serif;color:var(--text);background:var(--card);transition:border-color .2s,box-shadow .2s;direction:ltr;text-align:left}
    .login-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,0.1)}
    .login-input-wrap{position:relative}
    .login-input-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:18px;opacity:0.5;pointer-events:none}
    .login-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--gold),#e2c46a);color:#1a1a2e;font-size:16px;font-weight:900;cursor:pointer;transition:all .3s;margin-top:8px;font-family:'Tajawal',sans-serif}
    .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(200,168,75,0.35)}
    .login-btn:active{transform:translateY(0)}
    .login-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
    .login-error{background:rgba(220,38,38,0.08);border:1px solid rgba(220,38,38,0.2);color:var(--danger);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;margin-top:12px;display:none}
    .login-footer{margin-top:24px;font-size:11px;color:var(--text-muted);font-weight:600}

    /* ═══ PORTAL HEADER ═══ */
    .portal-header{background:linear-gradient(135deg,#6366f1 0%,#4f46e5 50%,#3730a3 100%);padding:0;position:relative;overflow:hidden}
    .portal-header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:20px;background:var(--bg);border-radius:20px 20px 0 0}
    .portal-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;max-width:1000px;margin:0 auto}
    .portal-nav-brand{display:flex;align-items:center;gap:12px}
    .portal-nav-logo{width:40px;height:40px;background:rgba(255,255,255,0.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
    .portal-nav-title{color:#fff;font-size:16px;font-weight:900;letter-spacing:0.5px}
    .portal-nav-sub{color:rgba(255,255,255,0.6);font-size:11px;font-weight:600}
    .portal-logout{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;transition:all .2s}
    .portal-logout:hover{background:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.35)}

    /* ═══ WELCOME CARD ═══ */
    .welcome-card{max-width:1000px;margin:-16px auto 24px;background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);position:relative;z-index:1;border:1px solid var(--border)}
    .welcome-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .welcome-avatar{width:52px;height:52px;background:linear-gradient(135deg,var(--primary),#8b5cf6);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:900;flex-shrink:0}
    .welcome-info{flex:1;min-width:0}
    .welcome-name{font-size:20px;font-weight:900;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .welcome-id{font-size:12px;color:var(--primary);font-weight:700;font-family:monospace;margin-top:2px}
    .welcome-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .w-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700}
    .w-badge.level{background:var(--primary-light);color:var(--primary)}
    .w-badge.type{background:var(--gold-light);color:var(--gold-dark)}
    .w-badge.status{background:var(--success-light);color:var(--success)}
    .w-badge.inst{background:rgba(100,116,139,0.08);color:var(--text-muted)}
    .w-badge.stream{background:rgba(99,102,241,0.08);color:var(--primary)}

    /* ═══ SUBJECTS ═══ */
    .subjects-section{max-width:1000px;margin:0 auto 32px;padding:0 16px}
    .section-title{font-size:17px;font-weight:900;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .subjects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
    .subject-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);transition:transform .2s,box-shadow .2s}
    .subject-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.08)}
    .subject-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .subject-icon{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
    .subject-name{font-size:15px;font-weight:900;color:var(--text)}
    .subject-teacher{font-size:12px;color:var(--text-muted);font-weight:600;margin-top:2px}
    .subject-stats{display:flex;gap:16px;margin-bottom:14px;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
    .subject-stat{display:flex;flex-direction:column;align-items:center;flex:1}
    .subject-stat-num{font-size:18px;font-weight:900;color:var(--text)}
    .subject-stat-label{font-size:10px;color:var(--text-muted);font-weight:700;margin-top:2px}
    .subject-actions{display:flex;gap:8px}
    .subject-btn{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:'Tajawal',sans-serif}
    .subject-btn:hover{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
    .subject-btn.disabled{opacity:0.5;cursor:not-allowed;pointer-events:none}

    .portal-footer{text-align:center;padding:20px;font-size:11px;color:var(--text-muted);font-weight:600}

    /* ═══ LOADING ═══ */
    .loading-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px}
    .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{font-size:14px;color:var(--text-muted);font-weight:600}

    /* ═══ ERROR ═══ */
    .error-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center}
    .error-icon{font-size:64px;margin-bottom:16px}
    .error-title{font-size:22px;font-weight:900;color:var(--text);margin-bottom:8px}
    .error-msg{font-size:14px;color:var(--text-muted);max-width:400px;line-height:1.7}

    @media(max-width:600px){
      .login-card{padding:28px 20px}
      .portal-nav{padding:12px 16px}
      .welcome-card{margin:-16px 12px 20px;padding:18px}
      .welcome-name{font-size:17px}
      .subjects-grid{grid-template-columns:1fr}
      .subject-card{padding:16px}
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading-page">
      <div class="spinner"></div>
      <div class="loading-text">جاري تحميل بوابة الطالب...</div>
    </div>
  </div>

  <script>
    const SP_URL='https://jftfvpultaqufhsekdle.supabase.co';
    const SP_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmdGZ2cHVsdGFxdWZoc2VrZGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NTI2NzMsImV4cCI6MjA5OTMyODY3M30.ep8b2omBGaN2qUB_XG8EE8XDhoRfAVAwnxOgEodEKBc';
    const SESSION_KEY='eplus_student_session';
    const SESSION_MAX_AGE=24*60*60*1000;

    const SUBJECT_ICONS={'الرياضيات':'📘','الفيزياء':'⚡','علوم الطبيعة والحياة':'🌿','العلوم التجريبية':'🔬','التقني رياضي':'💻','تسيير واقتصاد':'📊','آداب ولغات':'📖','اللغة العربية':'🕌','اللغة الفرنسية':'🇫🇷','اللغة الإنجليزية':'🇬🇧','التاريخ والجغرافيا':'🌍','الفلسفة':'🧠','الدين الإسلامي':'📖','الموسيقى':'🎵'};
    const SUBJECT_COLORS=['rgba(99,102,241,0.08)','rgba(16,185,129,0.08)','rgba(200,168,75,0.08)','rgba(239,68,68,0.08)','rgba(168,85,247,0.08)','rgba(14,165,233,0.08)','rgba(236,72,153,0.08)','rgba(34,197,94,0.08)'];

    function getTokenFromURL(){
      const m=window.location.pathname.match(/\/s\/(.+)/);
      if(m)return decodeURIComponent(m[1]);
      const p=new URLSearchParams(window.location.search);
      return p.get('t')||p.get('token')||p.get('id')||'';
    }

    function getSession(){
      try{
        const s=localStorage.getItem(SESSION_KEY);
        if(!s)return null;
        const obj=JSON.parse(s);
        if(Date.now()-obj.loginTime>SESSION_MAX_AGE){localStorage.removeItem(SESSION_KEY);return null;}
        return obj;
      }catch(e){localStorage.removeItem(SESSION_KEY);return null;}
    }

    function saveSession(r){
      localStorage.setItem(SESSION_KEY,JSON.stringify({id:r.id,student_token:r.student_token||'',loginTime:Date.now()}));
    }

    function clearSession(){localStorage.removeItem(SESSION_KEY);}

    function showLoading(){
      document.getElementById('app').innerHTML='<div class="loading-page"><div class="spinner"></div><div class="loading-text">جاري تحميل بوابة الطالب...</div></div>';
    }

    function showError(title,msg){
      document.getElementById('app').innerHTML=`<div class="error-page"><div class="error-icon">🔒</div><div class="error-title">${title}</div><div class="error-msg">${msg}</div></div>`;
    }

    function showLogin(errorMsg){
      document.getElementById('app').innerHTML=`
        <div class="login-page">
          <div class="login-card">
            <div class="login-logo">🎓</div>
            <div class="login-title">بوابة الطالب</div>
            <div class="login-subtitle">سجّل الدخول للوصول إلى حسابك</div>
            <form id="login-form" onsubmit="handleLogin(event)">
              <div class="login-field">
                <label class="login-label">رقم التسجيل (Student ID)</label>
                <div class="login-input-wrap">
                  <input class="login-input" type="text" id="login-id" placeholder="مثال: 734" required autocomplete="off" inputmode="numeric">
                  <span class="login-input-icon">📋</span>
                </div>
              </div>
              <div class="login-field">
                <label class="login-label">هاتف ولي الأمر</label>
                <div class="login-input-wrap">
                  <input class="login-input" type="tel" id="login-phone" placeholder="رقم هاتف ولي الأمر" required autocomplete="off" inputmode="tel">
                  <span class="login-input-icon">📱</span>
                </div>
              </div>
              <button class="login-btn" type="submit" id="login-btn">تسجيل الدخول ✦</button>
              <div class="login-error" id="login-error">${errorMsg||''}</div>
            </form>
            <div class="login-footer">E-PLUS — أكاديمية التعليم والدعم المدرسي</div>
          </div>
        </div>`;
    }

    async function handleLogin(e){
      e.preventDefault();
      const id=document.getElementById('login-id').value.trim();
      const phone=document.getElementById('login-phone').value.trim();
      const errEl=document.getElementById('login-error');
      const btn=document.getElementById('login-btn');
      if(!id||!phone){errEl.textContent='الرجاء ملء جميع الحقول';errEl.style.display='block';return;}
      btn.disabled=true;btn.textContent='جاري التحقق...';errEl.style.display='none';
      try{
        const res=await fetch(`${SP_URL}/rest/v1/registrations?select=*&id=eq.${encodeURIComponent(id)}&parent_phone=eq.${encodeURIComponent(phone)}&limit=1`,{
          headers:{'Content-Type':'application/json','apikey':SP_KEY,'Authorization':`Bearer ${SP_KEY}`}
        });
        if(!res.ok)throw new Error('HTTP '+res.status);
        const data=await res.json();
        if(!data||data.length===0){
          errEl.textContent='رقم التسجيل أو هاتف ولي الأمر غير صحيح. الرجاء المحاولة مرة أخرى.';
          errEl.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول ✦';return;
        }
        const r=data[0];
        if(r.status!=='مسجل نهائياً'){
          errEl.textContent='لا يمكن استخدام بوابة الطالب قبل تأكيد التسجيل النهائي من إدارة المركز. الرجاء مراجعة المركز لتأكيد تسجيلك.';
          errEl.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول ✦';return;
        }
        saveSession(r);
        renderDashboard(r);
      }catch(err){
        console.error('Login error:',err);
        errEl.textContent='حدث خطأ أثناء التحقق. الرجاء المحاولة لاحقاً.';
        errEl.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول ✦';
      }
    }

    function renderDashboard(r){
      const fullName=(r.first_name||'')+' '+(r.last_name||'');
      const subjects=Array.isArray(r.subjects)?r.subjects:[];
      const typeLabel=r.student_type==='حر'?'🎓 طالب حر':'📘 طالب متمدرس';
      const streamLabel=r.stream?' | '+r.stream:'';
      const initials=(r.first_name?r.first_name[0]:'')+(r.last_name?r.last_name[0]:'');

      let subjectsHTML='';
      if(subjects.length===0){
        subjectsHTML='<div style="text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px"><div style="font-size:40px;margin-bottom:8px">📭</div>لم تسجل في أي مادة بعد</div>';
      }else{
        subjectsHTML='<div class="subjects-grid">'+subjects.map((s,i)=>{
          const icon=SUBJECT_ICONS[s.subject]||'📘';
          const color=SUBJECT_COLORS[i%SUBJECT_COLORS.length];
          return `<div class="subject-card">
            <div class="subject-top">
              <div class="subject-icon" style="background:${color}">${icon}</div>
              <div><div class="subject-name">${s.subject||''}</div><div class="subject-teacher">👨‍🏫 ${s.teacher||''}</div></div>
            </div>
            <div class="subject-stats">
              <div class="subject-stat"><div class="subject-stat-num">—</div><div class="subject-stat-label">الدروس</div></div>
              <div class="subject-stat"><div class="subject-stat-num">—</div><div class="subject-stat-label">التمارين</div></div>
              <div class="subject-stat"><div class="subject-stat-num">—</div><div class="subject-stat-label">آخر تحديث</div></div>
            </div>
            <div class="subject-actions">
              <button class="subject-btn" disabled>📚 الدروس <span style="font-size:9px;color:var(--text-muted);margin-right:4px">قريباً</span></button>
              <button class="subject-btn" disabled>📝 التمارين <span style="font-size:9px;color:var(--text-muted);margin-right:4px">قريباً</span></button>
            </div>
          </div>`;
        }).join('')+'</div>';
      }

      document.getElementById('app').innerHTML=`
        <div class="portal-header">
          <div class="portal-nav">
            <div class="portal-nav-brand">
              <div class="portal-nav-logo">🎓</div>
              <div><div class="portal-nav-title">E-PLUS</div><div class="portal-nav-sub">بوابة الطالب</div></div>
            </div>
            <button class="portal-logout" onclick="handleLogout()">🚪 تسجيل الخروج</button>
          </div>
        </div>
        <div class="welcome-card">
          <div class="welcome-row">
            <div class="welcome-avatar">${initials}</div>
            <div class="welcome-info">
              <div class="welcome-name">مرحباً ${fullName} 👋</div>
              <div class="welcome-id">Student ID: ${r.id||''}</div>
            </div>
          </div>
          <div class="welcome-badges">
            <span class="w-badge level">📚 ${r.level||''}</span>
            <span class="w-badge type">${typeLabel}</span>
            <span class="w-badge status">✅ مسجل نهائياً</span>
            ${r.institution?`<span class="w-badge inst">🏫 ${r.institution}</span>`:''}
            ${streamLabel?`<span class="w-badge stream">${streamLabel}</span>`:''}
          </div>
        </div>
        <div class="subjects-section">
          <div class="section-title">📚 موادك المسجلة (${subjects.length})</div>
          ${subjectsHTML}
        </div>
        <div class="portal-footer">E-PLUS — أكاديمية التعليم والدعم المدرسي</div>`;
    }

    function handleLogout(){
      clearSession();
      window.location.href='/student.html';
    }

    async function init(){
      const urlToken=getTokenFromURL();
      if(urlToken){
        showLoading();
        try{
          const res=await fetch(`${SP_URL}/rest/v1/registrations?select=*&student_token=eq.${encodeURIComponent(urlToken)}&limit=1`,{
            headers:{'Content-Type':'application/json','apikey':SP_KEY,'Authorization':`Bearer ${SP_KEY}`}
          });
          if(!res.ok)throw new Error('HTTP '+res.status);
          const data=await res.json();
          if(!data||data.length===0){showError('طالب غير موجود','لم يتم العثور على تسجيل مرتبط بهذا الرابط.');return;}
          const r=data[0];
          if(r.status!=='مسجل نهائياً'){showError('بطاقة غير صالحة','لا يمكن استخدام هذه البطاقة قبل تأكيد التسجيل النهائي من إدارة المركز.');return;}
          saveSession(r);
          renderDashboard(r);
        }catch(e){console.error('Portal error:',e);showError('خطأ في التحميل','حدث خطأ أثناء تحميل البيانات. الرجاء المحاولة لاحقاً.');}
        return;
      }
      const session=getSession();
      if(session){
        showLoading();
        try{
          const res=await fetch(`${SP_URL}/rest/v1/registrations?select=*&id=eq.${encodeURIComponent(session.id)}&limit=1`,{
            headers:{'Content-Type':'application/json','apikey':SP_KEY,'Authorization':`Bearer ${SP_KEY}`}
          });
          if(!res.ok)throw new Error('HTTP '+res.status);
          const data=await res.json();
          if(!data||data.length===0){clearSession();showLogin('الطالب غير موجود في النظام.');return;}
          const r=data[0];
          if(r.status!=='مسجل نهائياً'){clearSession();showLogin('لم يتم تأكيد تسجيلك النهائي بعد.');return;}
          renderDashboard(r);
        }catch(e){console.error('Session restore error:',e);clearSession();showLogin('حدث خطأ أثناء تحميل البيانات.');}
        return;
      }
      showLogin();
    }

    init();
  </script>
</body>
</html>

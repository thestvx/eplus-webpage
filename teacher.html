<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الأستاذ — E-PLUS</title>
  <link rel="icon" type="image/x-icon" href="images/eplus-icon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --primary:#6366f1;--primary-dark:#4f46e5;--primary-darker:#3730a3;--primary-light:rgba(99,102,241,0.08);--primary-medium:rgba(99,102,241,0.15);
      --gold:#c8a84b;--gold-dark:#b09030;--gold-light:rgba(200,168,75,0.1);
      --bg:#f0f2f5;--card:#ffffff;--text:#1e293b;--text-secondary:#475569;--text-muted:#94a3b8;
      --border:#e2e8f0;--border-light:#f1f5f9;
      --success:#059669;--success-light:rgba(16,185,129,0.1);
      --danger:#dc2626;--danger-light:rgba(220,38,38,0.08);
      --blue:#0ea5e9;--blue-light:rgba(14,165,233,0.08);
      --sidebar-w:260px;--radius:14px;--radius-sm:10px;--radius-xs:8px;
      --shadow:0 1px 3px rgba(0,0,0,0.04),0 4px 12px rgba(0,0,0,0.04);
      --shadow-md:0 4px 16px rgba(0,0,0,0.06);--shadow-lg:0 8px 32px rgba(0,0,0,0.08);
      --transition:0.3s cubic-bezier(0.4,0,0.2,1);
    }
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    button{font-family:'Tajawal',sans-serif;cursor:pointer;border:none}
    input,textarea,select{font-family:'Tajawal',sans-serif}

    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scaleIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bgZoom{from{transform:scale(1.05)}to{transform:scale(1.12)}}
    @keyframes slideInDrawer{from{transform:translateX(100%)}to{transform:translateX(0)}}
    @keyframes slideOutDrawer{from{transform:translateX(0)}to{transform:translateX(100%)}}

    /* LOGIN */
    .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#1a1a2e}
    .login-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
    .login-bg video{width:100%;height:100%;object-fit:cover}
    .login-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(79,70,229,0.88),rgba(55,48,163,0.92));z-index:1;backdrop-filter:blur(2px)}
    .login-shapes{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
    .login-shape{position:absolute;border-radius:50%;background:rgba(255,255,255,0.04)}
    .login-shape:nth-child(1){width:300px;height:300px;top:-80px;right:-60px;animation:float 6s ease-in-out infinite}
    .login-shape:nth-child(2){width:200px;height:200px;bottom:-40px;left:-40px;animation:float 8s ease-in-out infinite 1s}
    .login-card{background:rgba(255,255,255,0.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.18);border-radius:24px;padding:44px 36px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.3);position:relative;z-index:2;text-align:center;animation:fadeSlideUp 0.7s ease both}
    .login-logo-img{max-width:200px;height:auto;margin:0 auto 32px;display:block;animation:scaleIn 0.6s ease both 0.1s;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.15))}
    .login-field{margin-bottom:18px;text-align:right}
    .login-label{display:block;font-size:13px;font-weight:700;color:rgba(255,255,255,0.8);margin-bottom:8px}
    .login-input{width:100%;padding:14px 16px 14px 48px;border:1.5px solid rgba(255,255,255,0.15);border-radius:var(--radius-sm);font-size:15px;font-weight:700;color:#fff;background:rgba(255,255,255,0.08);transition:var(--transition);direction:ltr;text-align:left}
    .login-input::placeholder{color:rgba(255,255,255,0.35)}
    .login-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,168,75,0.2);background:rgba(255,255,255,0.12)}
    .login-input-wrap{position:relative}
    .login-input-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:18px;opacity:0.5;pointer-events:none}
    .login-btn{width:100%;padding:15px;border:none;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--gold),#e2c46a);color:#1a1a2e;font-size:16px;font-weight:900;transition:var(--transition);margin-top:8px;box-shadow:0 4px 16px rgba(200,168,75,0.3)}
    .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(200,168,75,0.4)}
    .login-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
    .login-error{background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.3);color:#fca5a5;border-radius:var(--radius-xs);padding:12px 14px;font-size:13px;font-weight:700;margin-top:14px;display:none;backdrop-filter:blur(8px)}
    .login-footer{margin-top:28px;font-size:12px;color:rgba(255,255,255,0.4);font-weight:600}
    .login-role-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(200,168,75,0.2);color:var(--gold);margin-bottom:20px;border:1px solid rgba(200,168,75,0.3)}

    /* LAYOUT */
    .portal-layout{display:flex;min-height:100vh}
    .sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#1e1b4b 0%,#312e81 50%,#3730a3 100%);color:#fff;position:fixed;top:0;right:0;bottom:0;z-index:100;display:flex;flex-direction:column;overflow-y:auto;transition:var(--transition)}
    .sidebar::-webkit-scrollbar{width:0}
    .sidebar-brand{padding:28px 24px 20px;border-bottom:1px solid rgba(255,255,255,0.08)}
    .sidebar-brand-row{display:flex;align-items:center;gap:14px}
    .sidebar-logo{width:48px;height:48px;background:linear-gradient(135deg,var(--gold),#e2c46a);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;box-shadow:0 4px 16px rgba(200,168,75,0.3)}
    .sidebar-brand-text{flex:1;min-width:0}
    .sidebar-brand-name{font-size:18px;font-weight:900}
    .sidebar-brand-sub{font-size:11px;color:rgba(255,255,255,0.5);font-weight:600;margin-top:2px}
    .sidebar-teacher{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.08)}
    .sidebar-teacher-avatar{width:56px;height:56px;background:linear-gradient(135deg,rgba(255,255,255,0.15),rgba(255,255,255,0.05));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;margin:0 auto 12px;border:2px solid rgba(255,255,255,0.1)}
    .sidebar-teacher-name{text-align:center;font-size:15px;font-weight:800;margin-bottom:4px}
    .sidebar-teacher-id{text-align:center;font-size:11px;color:rgba(255,255,255,0.5);font-weight:600;font-family:monospace}
    .sidebar-nav{padding:16px 12px;flex:1}
    .sidebar-link{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-sm);color:rgba(255,255,255,0.7);font-size:14px;font-weight:600;transition:var(--transition);cursor:pointer;margin-bottom:2px}
    .sidebar-link:hover{background:rgba(255,255,255,0.08);color:#fff}
    .sidebar-link.active{background:linear-gradient(135deg,rgba(200,168,75,0.2),rgba(200,168,75,0.1));color:var(--gold);font-weight:700}
    .sidebar-link-icon{width:20px;text-align:center;font-size:16px}
    .sidebar-footer{padding:16px 24px;border-top:1px solid rgba(255,255,255,0.08)}
    .sidebar-logout{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:var(--radius-sm);background:rgba(220,38,38,0.12);border:1px solid rgba(220,38,38,0.2);color:#fca5a5;font-size:13px;font-weight:700;transition:var(--transition)}
    .sidebar-logout:hover{background:rgba(220,38,38,0.2);border-color:rgba(220,38,38,0.35)}
    .main-content{flex:1;margin-right:var(--sidebar-w);min-height:100vh}
    .main-topbar{display:none;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border);align-items:center;gap:12px;position:sticky;top:0;z-index:90}
    .topbar-toggle{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:18px;transition:var(--transition)}
    .topbar-brand{display:flex;align-items:center;gap:10px;flex:1}
    .topbar-logo{width:36px;height:36px;background:linear-gradient(135deg,var(--gold),#e2c46a);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
    .topbar-title{font-size:16px;font-weight:900}
    .topbar-logout{padding:8px 14px;border-radius:var(--radius-xs);background:var(--danger-light);color:var(--danger);font-size:12px;font-weight:700;transition:var(--transition)}
    .main-body{padding:32px 28px}

    /* HERO */
    .hero-card{background:linear-gradient(135deg,#4f46e5 0%,#6366f1 40%,#818cf8 100%);border-radius:20px;padding:36px 32px;color:#fff;position:relative;overflow:hidden;margin-bottom:28px;animation:fadeSlideUp 0.5s ease both}
    .hero-card::before{content:'';position:absolute;top:-50%;left:-20%;width:60%;height:200%;background:radial-gradient(circle,rgba(200,168,75,0.12) 0%,transparent 60%);pointer-events:none}
    .hero-row{display:flex;align-items:center;gap:20px;position:relative;z-index:1}
    .hero-avatar{width:68px;height:68px;background:rgba(255,255,255,0.15);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;border:2px solid rgba(255,255,255,0.2)}
    .hero-info{flex:1}
    .hero-greeting{font-size:13px;color:rgba(255,255,255,0.6);font-weight:600;margin-bottom:4px}
    .hero-name{font-size:24px;font-weight:900}
    .hero-id{font-size:12px;color:rgba(255,255,255,0.5);font-family:monospace;font-weight:600;margin-top:4px}
    .hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:relative;z-index:1}
    .hero-badge{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;backdrop-filter:blur(8px);background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.15)}

    /* STATS */
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
    .stat-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border-light);transition:var(--transition);position:relative;overflow:hidden}
    .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
    .stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;border-radius:0 var(--radius) var(--radius) 0}
    .stat-card.c-purple::before{background:var(--primary)}
    .stat-card.c-gold::before{background:var(--gold)}
    .stat-card.c-green::before{background:var(--success)}
    .stat-card.c-blue::before{background:var(--blue)}
    .stat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
    .stat-icon.i-purple{background:var(--primary-light)}
    .stat-icon.i-gold{background:var(--gold-light)}
    .stat-icon.i-green{background:var(--success-light)}
    .stat-icon.i-blue{background:var(--blue-light)}
    .stat-value{font-size:28px;font-weight:900;color:var(--text);line-height:1}
    .stat-label{font-size:12px;color:var(--text-muted);font-weight:600;margin-top:4px}

    /* CONTENT CARDS */
    .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .section-title{font-size:18px;font-weight:900;color:var(--text);display:flex;align-items:center;gap:8px}
    .section-count{background:var(--primary-light);color:var(--primary);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800}
    .content-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:32px}
    .content-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border-light);transition:var(--transition);animation:fadeSlideUp 0.5s ease both}
    .content-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
    .content-card-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .content-card-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
    .content-card-title{font-size:15px;font-weight:800;color:var(--text)}
    .content-card-sub{font-size:12px;color:var(--text-muted);font-weight:600;margin-top:2px}
    .content-card-body{font-size:13px;color:var(--text-secondary);line-height:1.7;margin-bottom:14px}
    .content-card-footer{display:flex;gap:8px}
    .content-btn{flex:1;padding:10px;border-radius:var(--radius-xs);border:1.5px solid var(--border);background:var(--card);color:var(--text-secondary);font-size:12px;font-weight:700;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:'Tajawal',sans-serif}
    .content-btn:hover{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
    .content-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
    .content-btn.primary:hover{background:var(--primary-dark)}

    .portal-footer{text-align:center;padding:24px;font-size:12px;color:var(--text-muted);font-weight:600}

    /* LOADING */
    .loading-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px}
    .spinner{width:44px;height:44px;border:3.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
    .loading-text{font-size:15px;color:var(--text-muted);font-weight:600}

    /* DRAWER */
    .drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;opacity:0;transition:opacity 0.3s ease;backdrop-filter:blur(2px)}
    .drawer-overlay.open{display:block;opacity:1}

    /* MODAL */
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
    .modal-bg.open{display:flex}
    .modal{background:var(--card);border-radius:20px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2);animation:scaleIn 0.3s ease both}
    .modal-header{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--border-light)}
    .modal-title{flex:1;font-size:17px;font-weight:900}
    .modal-close{width:32px;height:32px;border-radius:8px;background:var(--danger-light);color:var(--danger);display:flex;align-items:center;justify-content:center;font-size:16px;transition:var(--transition)}
    .modal-close:hover{background:rgba(220,38,38,0.15)}
    .modal-body{padding:24px}
    .form-group{margin-bottom:16px}
    .form-label{display:block;font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:6px}
    .form-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-xs);font-size:14px;font-weight:600;color:var(--text);background:var(--card);transition:var(--transition)}
    .form-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
    textarea.form-input{resize:vertical;min-height:80px}
    .form-btn{padding:10px 20px;border-radius:var(--radius-xs);font-size:13px;font-weight:700;transition:var(--transition)}
    .form-btn.primary{background:var(--primary);color:#fff;border:none}
    .form-btn.primary:hover{background:var(--primary-dark)}

    /* RESPONSIVE */
    @media(max-width:1024px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:768px){
      .sidebar{display:none}.main-content{margin-right:0}.main-topbar{display:flex}.main-body{padding:20px 16px}
      .hero-card{padding:24px 20px;border-radius:16px}.hero-avatar{width:56px;height:56px;font-size:22px}
      .hero-name{font-size:20px}.stats-grid{grid-template-columns:repeat(2,1fr);gap:12px}
      .content-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading-page"><div class="spinner"></div><div class="loading-text">جاري تحميل لوحة الأستاذ...</div></div>
  </div>
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>

  <!-- CONTENT MODAL -->
  <div class="modal-bg" id="content-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="content-modal-title">إضافة محتوى</div>
        <button class="modal-close" onclick="closeContentModal()">✕</button>
      </div>
      <div class="modal-body" id="content-modal-body"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyDzUxZQ...placeholder", authDomain: "eplus-center-39.firebaseapp.com", projectId: "eplus-center-39", storageBucket: "eplus-center-39.appspot.com", messagingSenderId: "123456789", appId: "1:123456789:web:placeholder" };

    let db, auth;
    try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); auth = firebase.auth(); } catch(e) { console.error('Firebase init error:', e); }

    const SESSION_KEY = 'eplus_teacher_session';
    const SESSION_MAX_AGE = 24*60*60*1000;
    const USERS_COLLECTION = 'users';
    const SRT_COLLECTION = 'support_teachers';
    const CONTENT_COLLECTION = 'teacher_content';

    let currentTeacher = null;
    let currentPage = 'home';
    let teacherSubjects = [];

    async function hashPassword(password, salt) {
      const enc = new TextEncoder();
      const data = enc.encode(salt + ':' + password);
      const buf = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getSession(){try{const s=localStorage.getItem(SESSION_KEY);if(!s)return null;const o=JSON.parse(s);if(Date.now()-o.loginTime>SESSION_MAX_AGE){localStorage.removeItem(SESSION_KEY);return null;}return o;}catch(e){localStorage.removeItem(SESSION_KEY);return null;}}
    function saveSession(user,teacher){localStorage.setItem(SESSION_KEY,JSON.stringify({userId:user.userId,username:user.username,role:user.role,teacherId:teacher.teacherId,teacherDocId:teacher.id,loginTime:Date.now()}));}
    function clearSession(){localStorage.removeItem(SESSION_KEY);}

    function showLoading(){document.getElementById('app').innerHTML='<div class="loading-page"><div class="spinner"></div><div class="loading-text">جاري تحميل لوحة الأستاذ...</div></div>';}

    /* ═══ LOGIN ═══ */
    function showLogin(errorMsg){
      document.getElementById('app').innerHTML=`
        <div class="login-page">
          <div class="login-bg"><video autoplay muted loop playsinline><source src="videos/videobackgroundteacher.mp4" type="video/mp4"></video></div><div class="login-overlay"></div>
          <div class="login-shapes"><div class="login-shape"></div><div class="login-shape"></div></div>
          <div class="login-card">
            <img class="login-logo-img" src="images/logostudentportal.png" alt="E-PLUS">
            <div class="login-role-badge">👨‍🏫 لوحة الأستاذ</div>
            <form onsubmit="handleLogin(event)">
              <div class="login-field">
                <label class="login-label">اسم المستخدم</label>
                <div class="login-input-wrap">
                  <input class="login-input" type="text" id="login-id" placeholder="اسم المستخدم" required autocomplete="off">
                  <span class="login-input-icon">👤</span>
                </div>
              </div>
              <div class="login-field">
                <label class="login-label">كلمة المرور</label>
                <div class="login-input-wrap">
                  <input class="login-input" type="password" id="login-pass" placeholder="كلمة المرور" required autocomplete="off">
                  <span class="login-input-icon">🔒</span>
                </div>
              </div>
              <button class="login-btn" type="submit" id="login-btn">تسجيل الدخول ✦</button>
              <div class="login-error" id="login-error">${errorMsg||''}</div>
            </form>
            <div class="login-footer">E-PLUS — أكاديمية التعليم والدعم المدرسي</div>
          </div>
        </div>`;
    }

    async function handleLogin(e){
      e.preventDefault();
      const username=document.getElementById('login-id').value.trim();
      const pass=document.getElementById('login-pass').value;
      const errEl=document.getElementById('login-error');
      const btn=document.getElementById('login-btn');
      if(!username||!pass){errEl.textContent='الرجاء ملء جميع الحقول';errEl.style.display='block';return;}
      btn.disabled=true;btn.textContent='جاري التحقق...';errEl.style.display='none';
      try{
        const userSnap=await db.collection(USERS_COLLECTION).where('username','==',username).limit(1).get();
        if(userSnap.empty){errEl.textContent='اسم المستخدم غير صحيح. الرجاء المحاولة مرة أخرى.';errEl.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول ✦';return;}
        const userDoc=userSnap.docs[0];
        const userData=userDoc.data();
        if(userData.role!=='teacher'){errEl.textContent='اسم المستخدم غير صحيح. الرجاء المحاولة مرة أخرى.';errEl.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول ✦';return;}
        if(userData.status!=='active'){errEl.textContent='تم تعطيل حسابك. الرجاء مراجعة الإدارة.';errEl.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول ✦';return;}
        const computedHash=await hashPassword(pass,userData.passwordSalt);
        if(computedHash!==userData.passwordHash){errEl.textContent='كلمة المرور غير صحيحة. الرجاء المحاولة مرة أخرى.';errEl.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول ✦';return;}
        const teacherSnap=await db.collection(SRT_COLLECTION).where('userId','==',userData.userId).limit(1).get();
        if(teacherSnap.empty){errEl.textContent='لا يوجد بروفايل مرتبط بهذا الحساب.';errEl.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول ✦';return;}
        const teacherDoc=teacherSnap.docs[0];
        const teacherData=teacherDoc.data();
        if(teacherData.status==='disabled'){errEl.textContent='تم تعطيل حسابك. الرجاء مراجعة الإدارة.';errEl.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول ✦';return;}
        const teacher={id:teacherDoc.id,...teacherData};
        saveSession(userData,teacher);
        try{await db.collection(USERS_COLLECTION).doc(userDoc.id).update({lastLogin:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){}
        renderDashboard(teacher);
      }catch(err){console.error('Teacher login error:',err);errEl.textContent='حدث خطأ أثناء التحقق.';errEl.style.display='block';btn.disabled=false;btn.textContent='تسجيل الدخول ✦';}
    }

    async function saveContent(){
      const t=currentTeacher;
      const type=document.getElementById('cnt-type').value;
      const subject=document.getElementById('cnt-subject').value;
      const level=document.getElementById('cnt-level').value;
      const title=document.getElementById('cnt-title').value.trim();
      const description=document.getElementById('cnt-desc').value.trim();
      const url=document.getElementById('cnt-url').value.trim();
      const urlType=document.getElementById('cnt-urltype').value;
      if(!title){alert('الرجاء إدخال العنوان');return;}
      try{
        await db.collection(CONTENT_COLLECTION).add({
          teacherId:t.teacherId||t.id,teacherName:t.name||'',type,subject,level,title,description,url,urlType,
          targetLevels:level?[level]:(Array.isArray(t.levels)?t.levels:[]),
          targetSubjects:subject?[subject]:(Array.isArray(t.subjects)?t.subjects.map(s=>typeof s==='string'?s:s.subject):[]),
          createdAt:firebase.firestore.FieldValue.serverTimestamp()
        });
        closeContentModal();renderContentPage();
      }catch(e){console.error('Save content error:',e);alert('حدث خطأ أثناء الحفظ');}
    }

      if(!confirm('هل أنت م chắc من حذف هذا المحتوى؟'))return;
      try{await db.collection(CONTENT_COLLECTION).doc(id).delete();renderContentPage();}catch(e){console.error('Delete content error:',e);}
    }

                <div class="stat-card c-purple" style="animation:fadeSlideUp 0.5s ease both 0.15s"><div class="stat-icon i-purple">📈</div><div class="stat-value" style="font-size:20px">${fmt(financeData.totalEarnings)}</div><div class="stat-label">إجمالي الأرباح</div></div>
                <div class="stat-card c-gold" style="animation:fadeSlideUp 0.5s ease both 0.2s"><div class="stat-icon i-gold">📋</div><div class="stat-value" style="font-size:20px">${fmt(financeData.totalDues)}</div><div class="stat-label">إجمالي المستحقات</div></div>
                <div class="stat-card c-blue" style="animation:fadeSlideUp 0.5s ease both 0.25s"><div class="stat-icon i-blue">✅</div><div class="stat-value" style="font-size:20px">${fmt(financeData.totalPaid)}</div><div class="stat-label">إجمالي المدفوعات</div></div>
              </div>
              <div class="section-header" style="margin-top:8px"><div class="section-title">📋 سجل المعاملات</div></div>
              <div style="background:var(--card);border-radius:var(--radius);border:1px solid var(--border-light);overflow-x:auto">
                <table style="width:100%;border-collapse:collapse"><thead><tr style="border-bottom:2px solid var(--border-light)"><th style="padding:10px 14px;text-align:right;font-size:12px;font-weight:800;color:var(--text-muted)">التاريخ</th><th style="padding:10px 14px;text-align:right;font-size:12px;font-weight:800;color:var(--text-muted)">الوصف</th><th style="padding:10px 14px;text-align:right;font-size:12px;font-weight:800;color:var(--text-muted)">المبلغ</th></tr></thead><tbody>${txRows}</tbody></table>
              </div>
              <div style="margin-top:24px;padding:20px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border-light);text-align:center">
                <div style="font-size:14px;font-weight:700;color:var(--text-muted)">🔄 سيتم تطوير هذا القسم ليشمل: نسبة الأستاذ من كل طالب، الرواتب، المكافآت، الخصومات، تقارير الأرباح</div>
              </div>
              <div class="portal-footer">E-PLUS — أكاديمية التعليم والدعم المدرسي © 2025</div>
            </div>
          </div>
        </div>`;
      updateSidebarActive();
    }

    function handleLogout(){clearSession();window.location.href='/teacher.html';}

    async function init(){
      const session=getSession();
      if(session){
        if(session.role && session.role!=='teacher'){clearSession();showLogin('صلاحيات غير كافية.');return;}
        showLoading();
        try{
          const doc=await db.collection(SRT_COLLECTION).doc(session.teacherDocId).get();
          if(!doc.exists){clearSession();showLogin('حساب الأستاذ غير موجود.');return;}
          const data=doc.data();
          if(data.status==='disabled'){clearSession();showLogin('تم تعطيل حسابك.');return;}
          renderDashboard({id:doc.id,...data});
        }catch(e){console.error('Session restore error:',e);clearSession();showLogin('حدث خطأ أثناء تحميل البيانات.');}
        return;
      }
      showLogin();
    }
    init();
  </script>

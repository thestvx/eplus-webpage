<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة الأستاذ — E-PLUS Academy</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" type="image/x-icon" href="images/eplus-icon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="js/JsBarcode.all.min.js?v=1"></script>
  <script src="js/ean13.js"></script>
  <script src="js/registrationService.js?v=4"></script>
  <script src="js/subjectService.js?v=4"></script>
  <script src="js/attendanceService.js?v=2"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --primary:#6366f1;--primary-light:rgba(99,102,241,0.07);--primary-dark:#4f46e5;--primary-50:rgba(99,102,241,0.05);
      --gold:#c8a84b;--gold-light:rgba(200,168,75,0.1);
      --bg:#f4f5f9;--card:#fff;--text:#1a1d2e;--text-muted:#6b7280;--text-secondary:#9ca3af;
      --border:#e5e7eb;--border-light:#f0f1f5;
      --radius:16px;--radius-sm:12px;--radius-xs:8px;--radius-lg:20px;
      --shadow:0 1px 3px rgba(0,0,0,0.04),0 4px 12px rgba(0,0,0,0.03);
      --shadow-md:0 4px 16px rgba(0,0,0,0.06);--shadow-lg:0 8px 32px rgba(0,0,0,0.08);
      --transition:all .22s cubic-bezier(.4,0,.2,1);
      --sidebar-w:250px;--header-h:64px;
      --green:#059669;--green-light:rgba(5,150,105,0.08);
      --red:#dc2626;--red-light:rgba(220,38,38,0.08);
      --blue:#2563eb;--blue-light:rgba(37,99,235,0.08);
      --purple:#7c3aed;--purple-light:rgba(124,58,237,0.08);
    }
    html,body{height:100%;overflow:hidden}
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}

    @keyframes fadeSlideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeOut{from{opacity:1}to{opacity:0}}
    @keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pageOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-8px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(5,150,105,0.15)}50%{box-shadow:0 0 0 12px rgba(5,150,105,0)}}
    @keyframes toastIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-16px)}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

    /* ===== LOGIN ===== */
    .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#1a1a2e;padding:20px}
    .login-bg{position:absolute;inset:0;z-index:0}.login-bg video{width:100%;height:100%;object-fit:cover}
    .login-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(79,70,229,0.88),rgba(55,48,163,0.92));z-index:1;backdrop-filter:blur(2px)}
    .login-shapes{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
    .login-shape{position:absolute;border-radius:50%;background:rgba(255,255,255,0.04)}
    .login-shape:nth-child(1){width:300px;height:300px;top:-80px;right:-60px;animation:float 6s ease-in-out infinite}
    .login-shape:nth-child(2){width:200px;height:200px;bottom:-40px;left:-40px;animation:float 8s ease-in-out infinite 1s}
    .login-shape:nth-child(3){width:140px;height:140px;top:40%;left:10%;animation:float 7s ease-in-out infinite 2s}
    .login-card{background:rgba(255,255,255,0.1);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.15);border-radius:28px;padding:48px 40px;width:100%;max-width:460px;box-shadow:0 24px 80px rgba(0,0,0,0.35);position:relative;z-index:2;text-align:center;animation:fadeSlideUp .7s cubic-bezier(.22,1,.36,1) both}
    .login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--primary),var(--gold));border-radius:28px 28px 0 0}
    .login-logo-wrap{margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
    .login-logo-wrap img{height:100px;max-width:280px;object-fit:contain;filter:drop-shadow(0 4px 20px rgba(255,255,255,0.15))}
    .login-role-badge{display:inline-flex;align-items:center;gap:8px;padding:10px 26px;border-radius:24px;font-size:15px;font-weight:800;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.85);margin-bottom:28px;border:1px solid rgba(255,255,255,0.1)}
    .login-field{margin-bottom:18px;text-align:right}
    .login-label{display:block;font-size:13px;font-weight:700;color:rgba(255,255,255,0.7);margin-bottom:8px}
    .login-input-wrap{display:flex;align-items:center;border:2px solid rgba(255,255,255,0.12);border-radius:14px;background:rgba(255,255,255,0.06);transition:var(--transition)}
    .login-input-wrap:hover{border-color:rgba(255,255,255,0.22)}
    .login-input-wrap:focus-within{border-color:var(--gold);background:rgba(255,255,255,0.1);box-shadow:0 0 0 4px rgba(200,168,75,0.15)}
    .login-input-icon{padding:0 14px;font-size:18px;flex-shrink:0;opacity:.5;pointer-events:none}
    .login-input{flex:1;border:none;background:transparent;padding:15px 14px 15px 0;color:#fff;font-size:15px;font-weight:600;font-family:'Tajawal',sans-serif;outline:none;min-width:0}
    .login-input::placeholder{color:rgba(255,255,255,0.3)}
    .login-toggle-pass{padding:0 14px;font-size:18px;cursor:pointer;opacity:.5;transition:var(--transition);background:none;border:none;color:#fff;line-height:1;flex-shrink:0}
    .login-toggle-pass:hover{opacity:.9}
    .login-btn{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--gold),#e2c46a);color:#1a1a2e;font-size:16px;font-weight:900;cursor:pointer;transition:var(--transition);margin-top:10px;box-shadow:0 6px 24px rgba(200,168,75,0.3);font-family:'Tajawal',sans-serif;position:relative;overflow:hidden}
    .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(200,168,75,0.4)}
    .login-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
    .login-btn .btn-spinner{display:none;width:22px;height:22px;border:3px solid rgba(26,26,46,0.2);border-top-color:#1a1a2e;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
    .login-btn.loading .btn-text{display:none}.login-btn.loading .btn-spinner{display:block}
    .login-error{display:none;margin-top:14px;padding:12px 16px;border-radius:12px;background:rgba(220,38,38,0.12);border:1px solid rgba(220,38,38,0.25);color:#fca5a5;font-size:13px;font-weight:700;text-align:center}
    .login-footer{margin-top:28px;font-size:11px;color:rgba(255,255,255,0.3)}

    /* ===== APP LAYOUT ===== */
    .app-layout{display:flex;height:100vh;overflow:hidden}

    /* ===== SIDEBAR ===== */
    .sidebar{width:var(--sidebar-w);background:#fff;border-left:1px solid var(--border);position:fixed;top:0;right:0;bottom:0;z-index:100;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:transform .3s cubic-bezier(.4,0,.2,1)}
    .sidebar::-webkit-scrollbar{width:3px}.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    .sidebar-brand{padding:20px 20px 16px;border-bottom:1px solid var(--border-light)}
    .sidebar-brand-row{display:flex;align-items:center;gap:12px}
    .sidebar-logo{width:40px;height:40px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;color:#fff;font-weight:900;box-shadow:0 2px 8px rgba(99,102,241,0.2)}
    .sidebar-brand-name{font-size:16px;font-weight:900;color:var(--text);letter-spacing:.5px}
    .sidebar-brand-sub{font-size:10px;color:var(--text-muted);font-weight:600;margin-top:1px;letter-spacing:.3px}
    .sidebar-teacher{padding:18px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:12px}
    .sidebar-teacher-avatar{width:42px;height:42px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--gold),#e2c46a);color:#1a1d2e;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;flex-shrink:0}
    .sidebar-teacher-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sidebar-teacher-id{font-size:10px;color:var(--text-muted);margin-top:1px;font-family:monospace;direction:ltr;text-align:right}
    .sidebar-nav{flex:1;padding:12px 10px}
    .sidebar-section-label{font-size:10px;font-weight:800;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px;padding:12px 14px 6px;margin-top:4px}
    .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);font-size:13.5px;font-weight:600;color:var(--text-muted);margin-bottom:2px;position:relative;overflow:hidden}
    .sidebar-link:hover{background:var(--bg);color:var(--text)}
    .sidebar-link.active{background:var(--primary-light);color:var(--primary);font-weight:700}
    .sidebar-link.active::before{content:'';position:absolute;right:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
    .sidebar-link-icon{width:32px;height:32px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;background:var(--bg);transition:var(--transition)}
    .sidebar-link.active .sidebar-link-icon{background:rgba(99,102,241,0.12)}
    .sidebar-footer{padding:12px 10px;border-top:1px solid var(--border-light)}
    .sidebar-logout{width:100%;padding:10px;border:none;border-radius:var(--radius-sm);background:var(--red-light);color:var(--red);font-size:12.5px;font-weight:700;cursor:pointer;transition:var(--transition);font-family:'Tajawal',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
    .sidebar-logout:hover{background:var(--red);color:#fff}

    /* ===== MAIN AREA ===== */
    .main-area{flex:1;margin-right:var(--sidebar-w);display:flex;flex-direction:column;height:100vh;overflow:hidden}

    /* ===== HEADER ===== */
    .main-header{height:var(--header-h);background:var(--card);border-bottom:1px solid var(--border-light);display:flex;align-items:center;padding:0 28px;gap:16px;flex-shrink:0;z-index:90}
    .header-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer;padding:6px 10px;border-radius:var(--radius-xs);transition:var(--transition);color:var(--text)}.header-toggle:hover{background:var(--bg)}
    .header-title{font-size:17px;font-weight:800;color:var(--text)}
    .header-spacer{flex:1}
    .header-search{display:flex;align-items:center;background:var(--bg);border:1.5px solid transparent;border-radius:var(--radius-sm);padding:0 14px;height:38px;transition:var(--transition);min-width:200px}
    .header-search:focus-within{border-color:var(--primary);background:var(--card);box-shadow:0 0 0 3px rgba(99,102,241,0.08)}
    .header-search-icon{font-size:14px;margin-left:8px;opacity:.4}.header-search input{border:none;background:none;outline:none;font-size:13px;font-weight:600;color:var(--text);font-family:'Tajawal',sans-serif;width:100%}
    .header-search input::placeholder{color:var(--text-secondary)}
    .header-avatar{width:36px;height:36px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--gold),#e2c46a);color:#1a1d2e;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0;cursor:pointer;transition:var(--transition)}
    .header-avatar:hover{transform:scale(1.05)}
    .header-notify{position:relative;background:none;border:none;font-size:19px;cursor:pointer;padding:6px;border-radius:var(--radius-xs);transition:var(--transition);color:var(--text-muted)}.header-notify:hover{background:var(--bg);color:var(--primary)}
    .header-notify-dot{position:absolute;top:4px;left:4px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--card)}
    .header-home{background:none;border:1.5px solid var(--border);padding:6px 14px;border-radius:var(--radius-xs);font-size:12px;font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif;transition:var(--transition);color:var(--text-muted);text-decoration:none;display:flex;align-items:center;gap:6px}.header-home:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
    .header-logout{background:none;border:1.5px solid var(--red);color:var(--red);padding:6px 14px;border-radius:var(--radius-xs);font-size:12px;font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif;transition:var(--transition);display:flex;align-items:center;gap:6px}.header-logout:hover{background:var(--red-light)}

    /* ===== CONTENT SCROLL ===== */
    .main-scroll{flex:1;overflow-y:auto;padding:28px 32px 40px}
    .main-scroll::-webkit-scrollbar{width:5px}.main-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    .content-inner{max-width:1400px;margin:0 auto}

    /* ===== PAGE SECTIONS ===== */
    .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .page-title{font-size:20px;font-weight:900;display:flex;align-items:center;gap:10px;color:var(--text)}
    .page-title-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .page-subtitle{font-size:12.5px;color:var(--text-muted);font-weight:500;margin-top:2px}

    /* ===== WELCOME SECTION ===== */
    .welcome-section{background:linear-gradient(135deg,#1e1b4b 0%,#2d2a70 50%,#3730a3 100%);border-radius:var(--radius-lg);padding:32px;color:#fff;position:relative;overflow:hidden;margin-bottom:24px}
    .welcome-section::before{content:'';position:absolute;top:-60px;left:-60px;width:200px;height:200px;background:rgba(200,168,75,0.06);border-radius:50%;pointer-events:none}
    .welcome-section::after{content:'';position:absolute;bottom:-40px;right:10%;width:160px;height:160px;background:rgba(99,102,241,0.08);border-radius:50%;pointer-events:none}
    .welcome-greeting{font-size:24px;font-weight:900;margin-bottom:4px;position:relative;z-index:1}
    .welcome-sub{font-size:13px;opacity:.6;font-weight:500;position:relative;z-index:1}
    .welcome-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:relative;z-index:1}
    .welcome-badge{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.07)}

    /* ===== STATS GRID ===== */
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
    .stat-card{background:var(--card);border-radius:var(--radius);padding:22px;border:1px solid var(--border-light);transition:var(--transition);position:relative;overflow:hidden;cursor:default}
    .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
    .stat-card::after{content:'';position:absolute;top:0;right:0;left:0;height:3px;border-radius:3px 3px 0 0;opacity:0;transition:var(--transition)}.stat-card:hover::after{opacity:1}
    .stat-icon{width:44px;height:44px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
    .stat-value{font-size:28px;font-weight:900;line-height:1.2}
    .stat-label{font-size:12px;color:var(--text-muted);font-weight:600;margin-top:3px}
    .stat-card.c-purple .stat-icon{background:var(--purple-light);color:var(--purple)}.stat-card.c-purple::after{background:var(--purple)}
    .stat-card.c-green .stat-icon{background:var(--green-light);color:var(--green)}.stat-card.c-green::after{background:var(--green)}
    .stat-card.c-blue .stat-icon{background:var(--blue-light);color:var(--blue)}.stat-card.c-blue::after{background:var(--blue)}
    .stat-card.c-gold .stat-icon{background:var(--gold-light);color:var(--gold)}.stat-card.c-gold::after{background:var(--gold)}

    /* ===== QUICK ACTIONS ===== */
    .quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
    .quick-action{background:var(--card);border:1px solid var(--border-light);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:var(--transition);text-decoration:none;color:var(--text)}
    .quick-action:hover{border-color:var(--primary);background:var(--primary-light);transform:translateY(-1px);box-shadow:var(--shadow)}
    .quick-action-icon{width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .quick-action-text{font-size:13px;font-weight:700}
    .quick-action-desc{font-size:11px;color:var(--text-muted);margin-top:1px}

    /* ===== CONTENT GRID (2-col) ===== */
    .dash-columns{display:grid;grid-template-columns:1fr 360px;gap:24px}

    /* ===== SECTION CARD ===== */
    .section-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border-light);overflow:hidden}
    .section-card-header{padding:16px 20px 12px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
    .section-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--text)}
    .section-title-icon{font-size:16px}
    .section-card-body{padding:14px 20px 18px}
    .section-more{font-size:11px;font-weight:700;color:var(--primary);cursor:pointer;transition:var(--transition);background:none;border:none;font-family:'Tajawal',sans-serif}.section-more:hover{color:var(--primary-dark)}

    /* ===== CONTENT ITEMS (compact list) ===== */
    .content-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-light);transition:var(--transition)}
    .content-item:last-child{border-bottom:none}
    .content-item:hover{background:var(--primary-50);margin:0 -20px;padding:10px 20px;border-radius:var(--radius-xs)}
    .content-item-icon{width:36px;height:36px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .content-item-icon.lesson{background:var(--blue-light);color:var(--blue)}.content-item-icon.exercise{background:var(--green-light);color:var(--green)}.content-item-icon.homework{background:var(--gold-light);color:var(--gold)}.content-item-icon.announcement{background:var(--purple-light);color:var(--purple)}
    .content-item-info{flex:1;min-width:0}
    .content-item-title{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
    .content-item-meta{font-size:11px;color:var(--text-muted);margin-top:1px;display:flex;align-items:center;gap:6px}
    .content-item-date{font-size:10.5px;color:var(--text-secondary);white-space:nowrap;flex-shrink:0}

    /* ===== ACTIVITY LIST ===== */
    .activity-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-light)}
    .activity-item:last-child{border-bottom:none}
    .activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px}
    .activity-dot.green{background:var(--green)}.activity-dot.blue{background:var(--blue)}.activity-dot.gold{background:var(--gold)}.activity-dot.purple{background:var(--purple)}
    .activity-text{font-size:12px;color:var(--text);font-weight:500;line-height:1.6}
    .activity-time{font-size:10.5px;color:var(--text-secondary);margin-top:2px}

    /* ===== EMPTY STATE ===== */
    .empty-state{text-align:center;padding:40px 20px}
    .empty-state-icon{font-size:44px;margin-bottom:12px;opacity:.35;line-height:1}
    .empty-state-text{font-size:14px;font-weight:800;color:var(--text);margin-bottom:6px}
    .empty-state-sub{font-size:12.5px;color:var(--text-muted);margin-bottom:16px;max-width:280px;margin:0 auto 16px;line-height:1.7}
    .empty-state-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;border:none;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:13px;font-weight:800;cursor:pointer;transition:var(--transition);font-family:'Tajawal',sans-serif;box-shadow:0 4px 14px rgba(99,102,241,0.25)}
    .empty-state-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,0.35)}

    /* ===== CONTENT GRID (full page) ===== */

    /* ===== UPLOAD ZONE ===== */

    /* ===== MODAL ===== */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px)}.modal-bg.open{opacity:1;pointer-events:auto}
    .modal{background:var(--card);border-radius:var(--radius);width:92%;max-width:580px;max-height:85vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,0.1);transform:translateY(20px);transition:transform .3s cubic-bezier(.22,1,.36,1)}.modal-bg.open .modal{transform:translateY(0)}
    .modal-header{padding:22px 26px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:14px}.modal-title{font-size:17px;font-weight:800;flex:1}
    .modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-muted);padding:6px;border-radius:var(--radius-xs);transition:var(--transition);line-height:1}.modal-close:hover{background:var(--red-light);color:var(--red)}

    /* ===== BUTTONS ===== */
    .btn-primary{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:15px;font-weight:800;cursor:pointer;transition:var(--transition);font-family:'Tajawal',sans-serif}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,0.3)}.btn-primary:active{transform:translateY(0)}.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    .btn-add{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border:none;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:var(--transition);font-family:'Tajawal',sans-serif;box-shadow:0 3px 12px rgba(99,102,241,0.2)}.btn-add:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,0.3)}

    /* ===== PORTAL FOOTER ===== */
    .portal-footer{text-align:center;padding:20px;font-size:11px;color:var(--text-secondary);border-top:1px solid var(--border-light);margin-top:20px}

    /* ===== LOADING / SPINNER ===== */
    .loading-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;padding:40px 20px}
    .spinner{width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}

    /* ===== MOBILE OVERLAY ===== */
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:99;backdrop-filter:blur(2px)}

    /* ===== FILTER BAR ===== */
    .filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
    .filter-bar select,.filter-bar input{padding:9px 14px;border:1.5px solid var(--border);border-radius:var(--radius-xs);font-size:13px;font-weight:600;color:var(--text);background:var(--card);font-family:'Tajawal',sans-serif;transition:var(--transition)}
    .filter-bar select:focus,.filter-bar input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,0.08)}

    /* ===== CUSTOM MODAL SYSTEM ===== */
    .cm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}.cm-overlay.open{opacity:1;pointer-events:auto}

    .cm-icon{font-size:48px;margin-bottom:12px;line-height:1}

    .cm-btn-cancel{background:var(--bg);color:var(--text-muted);border:1.5px solid var(--border)}.cm-btn-cancel:hover{background:var(--border)}
    .cm-btn-confirm{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 4px 14px rgba(99,102,241,0.25)}.cm-btn-confirm:hover{transform:translateY(-1px)}
    .cm-btn-danger{background:linear-gradient(135deg,var(--red),#b91c1c);color:#fff}.cm-btn-danger:hover{transform:translateY(-1px)}
    .cm-btn-success{background:linear-gradient(135deg,var(--green),#047857);color:#fff}.cm-btn-success:hover{transform:translateY(-1px)}

    /* ===== TOAST ===== */
    .toast-wrap{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
    .toast{padding:14px 24px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,0.15);pointer-events:auto;animation:toastIn .3s cubic-bezier(.22,1,.36,1);display:flex;align-items:center;gap:10px;max-width:420px}
    .toast.success{background:linear-gradient(135deg,#059669,#10b981)}.toast.error{background:linear-gradient(135deg,#dc2626,#ef4444)}.toast.info{background:linear-gradient(135deg,#6366f1,#818cf8)}

    /* ===== RESPONSIVE ===== */
    @media(max-width:1200px){
      .dash-columns{grid-template-columns:1fr 300px}
      .main-scroll{padding:24px 24px 36px}
    }
    @media(max-width:1024px){

      .content-grid{grid-template-columns:1fr}
      .welcome-meta{gap:6px}
      .welcome-badge{font-size:10px;padding:4px 10px}
    }
  </style>
</head>

    function fmtTimeAgo(d){if(!d)return'';const t=d.seconds?new Date(d.seconds*1000):new Date(d);const diff=Date.now()-t.getTime();const mins=Math.floor(diff/60000);if(mins<1)return'الآن';if(mins<60)return'منذ '+mins+' دقيقة';const hrs=Math.floor(mins/60);if(hrs<24)return'منذ '+hrs+' ساعة';const days=Math.floor(hrs/24);return'منذ '+days+' يوم';}

    /* ===== CUSTOM MODAL SYSTEM ===== */
    let cmResolve=null;
    function cmShow(icon,title,desc,opts={}){
      return new Promise(resolve=>{
        document.getElementById('cm-icon').textContent=icon;

        document.getElementById('cm-desc').innerHTML=desc;
        const cancelBtn=document.getElementById('cm-cancel-btn');

        cancelBtn.style.display=opts.hideCancel?'none':'inline-block';
        cancelBtn.textContent=opts.cancelText||'إلغاء';
        confirmBtn.textContent=opts.confirmText||'تأكيد';
        confirmBtn.className='cm-btn '+(opts.danger?'cm-btn-danger':opts.success?'cm-btn-success':'cm-btn-confirm');
        document.getElementById('cm-overlay').classList.add('open');
        cmResolve=(val)=>{document.getElementById('cm-overlay').classList.remove('open');resolve(val);};
        setTimeout(()=>confirmBtn.focus(),100);
      });
    }
    function cmAlert(title,desc,icon='✅'){return cmShow(icon,title,desc,{hideCancel:true,confirmText:'موافق'});}
    function cmConfirm(title,desc,icon='⚠️',opts={}){return cmShow(icon,title,desc,{...opts});}

    function renderHeader(t){

    function setupUploadZone(){
      const zone=document.getElementById('upload-zone'),input=document.getElementById('file-input');
      zone.addEventListener('click',()=>input.click());
      zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover');});
      zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
      zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('dragover');handleFiles(e.dataTransfer.files);});
      input.addEventListener('change',e=>handleFiles(e.target.files));
    }
    function handleFiles(fileList){
      for(const file of fileList){
        let fileType=file.type;
        if(!fileType||fileType==='application/octet-stream'){fileType=guessMimeType(file.name);}
        if(!ALLOWED_TYPES.includes(fileType)){showToast('نوع الملف غير مدعوم: '+file.name,'error');continue;}
        if(file.size>MAX_FILE_SIZE){showToast('الملف كبير جداً: '+file.name+' (حد أقصى 50MB)','error');continue;}
        if(pendingFiles.length>=10){showToast('حد أقصى 10 ملفات','error');break;}
        pendingFiles.push({file,name:file.name,size:file.size,type:fileType,progress:0,uploaded:false,url:''});
      }
      renderFileList();
    }
    function renderFileList(){
      const container=document.getElementById('file-list');if(!container)return;
      if(pendingFiles.length===0){container.innerHTML='';return;}
      container.innerHTML=pendingFiles.map((f,i)=>{const icon=f.type.startsWith('image/')?'🖼️':f.type==='application/pdf'?'📄':f.type.includes('video')?'🎬':'📎';const size=f.size>1024*1024?(f.size/(1024*1024)).toFixed(1)+'MB':(f.size/1024).toFixed(0)+'KB';return '<div class="file-item"><span class="file-item-icon">'+icon+'</span><div class="file-item-info"><div class="file-item-name">'+f.name+'</div><div class="file-item-size">'+size+'</div>'+(f.progress>0&&f.progress<100?'<div class="file-progress"><div class="file-progress-bar" style="width:'+f.progress+'%"></div></div>':'')+(f.uploaded?'<div style="color:var(--green);font-size:11px;font-weight:700">✅ تم الرفع</div>':'')+'</div><button class="file-item-remove" onclick="removeFile('+i+')">✕</button></div>';}).join('');
    }
    function removeFile(i){pendingFiles.splice(i,1);renderFileList();}
    function guessMimeType(filename){
      const ext=(filename||'').split('.').pop().toLowerCase();
      const map={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',mp4:'video/mp4',zip:'application/zip'};
      return map[ext]||'application/octet-stream';
    }
    let _uploadTokenPromise=null;
    function uploadToken(){
      if(!_uploadTokenPromise){
        _uploadTokenPromise=new Promise(function(resolve){
          if(typeof firebase!=='undefined'&&firebase.auth&&typeof firebase.auth==='function'){
            firebase.auth().signInAnonymously().then(function(){resolve(firebase.auth().currentUser.getIdToken());}).catch(function(){resolve(null);});
          }else{resolve(null);}
        });
      }
      return _uploadTokenPromise;
    }
    async function uploadFileToStorage(fileObj,teacherId){
      const url=CONTENT_UPLOAD_URL+'?teacherId='+encodeURIComponent(teacherId)+'&filename='+encodeURIComponent(fileObj.name);
      const token=await uploadToken();
      if(!token)throw new Error('تعذر التحقق من الجلسة — حاول مرة أخرى');
      const buffer=await fileObj.file.arrayBuffer();
      const uploadBlob=new Blob([buffer],{type:fileObj.type});
      return new Promise((resolve,reject)=>{
        const xhr=new XMLHttpRequest();
        xhr.upload.addEventListener('progress',e=>{if(e.lengthComputable){fileObj.progress=Math.round((e.loaded/e.total)*100);renderFileList();}});
        xhr.addEventListener('load',()=>{
          if(xhr.status>=200&&xhr.status<300){
            let r=null;try{r=JSON.parse(xhr.responseText);}catch(e){}
            if(r&&r.ok&&r.url){
              fileObj.uploaded=true;fileObj.url=r.url;fileObj.storagePath=r.path;fileObj.progress=100;renderFileList();
              resolve({name:fileObj.name,size:fileObj.size,type:fileObj.type,url:r.url,storagePath:r.path});
            }else{reject(new Error((r&&r.error)||('Upload failed: '+xhr.status)));}
          }else{reject(new Error('Upload failed: '+xhr.status+' '+xhr.responseText));}
        });
        xhr.addEventListener('error',()=>reject(new Error('Network error during upload')));
        xhr.open('POST',url);
        xhr.setRequestHeader('Authorization','Bearer '+token);
        xhr.setRequestHeader('Content-Type',fileObj.type);
        xhr.send(uploadBlob);
      });
    }
    async function saveContent(){
      const t=currentTeacher,teacherId=t.teacherId||t.id;
      const type=document.getElementById('cnt-type').value,subject=document.getElementById('cnt-subject').value,level=document.getElementById('cnt-level').value;
      const title=document.getElementById('cnt-title').value.trim(),description=document.getElementById('cnt-desc').value.trim(),url=document.getElementById('cnt-url').value.trim();
      if(!title){showToast('الرجاء إدخال عنوان','error');return;}
      const btn=document.getElementById('cnt-save-btn');btn.disabled=true;btn.textContent='⏳ جاري الحفظ...';
      try{const attachments=[];for(const f of pendingFiles){if(!f.uploaded){const result=await uploadFileToStorage(f,teacherId);attachments.push(result);}else{attachments.push({name:f.name,size:f.size,type:f.type,url:f.url,storagePath:f.storagePath});}}
        if(editingContentId){
          const updateData={type,subject,level,title,description,url:url||''};
          if(attachments.length>0){
            const existingDoc=await db.collection(CONTENT_COLLECTION).doc(editingContentId).get();
            const existingAttachments=existingDoc.exists?(existingDoc.data().attachments||[]):[];
            updateData.attachments=[...existingAttachments,...attachments];
          }
          await db.collection(CONTENT_COLLECTION).doc(editingContentId).update(updateData);
        }else{
          await db.collection(CONTENT_COLLECTION).add({teacherId,teacherName:t.name||'',type,subject,level,title,description,url:url||'',attachments,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
        }
        closeContentModal();if(currentPage==='content')renderContentPage();
      }catch(e){console.error('Save content error:',e);showToast('حدث خطأ أثناء الحفظ: '+e.message,'error');}
      btn.disabled=false;btn.textContent=editingContentId?'💾 حفظ التعديلات':'💾 حفظ المحتوى';
    }

    /* ===== STUDENTS PAGE ===== */
    let _allStudentsData=[];
    async function renderStudentsPage(){
      currentTeacher=currentTeacher||{};const t=currentTeacher,teacherId=t.teacherId||t.id;
      const subjects=Array.isArray(t.subjects)?t.subjects.map(s=>s.subject||s):[];
      document.getElementById('app').innerHTML=`
        <div class="app-layout">
          <aside class="sidebar" id="sidebar">${renderSidebar(t)}</aside>
          <div class="main-area">
            <header class="main-header">${renderHeader(t)}</header>
            <div class="main-scroll">
              <div class="content-inner">
                <div class="page-header">
                  <div><div class="page-title"><span class="page-title-icon" style="background:var(--purple-light);color:var(--purple)">👥</span>الطلاب المسجلون</div><div class="page-subtitle">قائمة الطلاب المسجلين نهائياً في موادك</div></div>
                  <div style="font-size:13px;font-weight:800;color:var(--primary);background:var(--primary-light);padding:8px 18px;border-radius:var(--radius-sm)" id="students-count">...</div>
                </div>
                <div class="filter-bar" style="margin-bottom:20px">
                  <div style="display:flex;align-items:center;gap:8px;flex:1;max-width:360px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-xs);padding:0 14px;height:40px;transition:var(--transition)">
                    <span style="font-size:14px;opacity:.4">🔍</span>
                    <input type="text" id="student-search" placeholder="بحث بالاسم أو رقم التسجيل..." oninput="filterStudents(this.value)" style="flex:1;border:none;outline:none;font-size:13px;font-weight:600;color:var(--text);background:transparent;font-family:'Tajawal',sans-serif">
                  </div>
                </div>
                <div id="students-table-wrap"><div class="loading-page"><div class="spinner"></div></div></div>
                <div class="portal-footer">E-PLUS — أكاديمية التعليم والدعم المدرسي © 2025</div>
              </div>
            </div>
          </div>
        </div>`;
      try{
        const statusParam=encodeURIComponent('مسجل نهائياً');
        const url=SUPABASE_URL+'/rest/v1/registrations?select=id,first_name,last_name,status,level,stream,subjects,timestamp,createdAt,deleted_at&status=eq.'+statusParam;
        console.log('[Students] Fetching:',url);
        const res=await fetch(url,{headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
        const text=await res.text();
        console.log('[Students] Response status:',res.status,'body:',text.substring(0,500));
        if(!res.ok)throw new Error('HTTP '+res.status+': '+text.substring(0,200));
        let rows=[];
        try{rows=JSON.parse(text);}catch(e){throw new Error('Invalid JSON response');}
        if(!Array.isArray(rows))throw new Error('Expected array, got: '+typeof rows);
        console.log('[Students] Got',rows.length,'rows. First:',rows[0]);
        const active=rows.filter(d=>!d.deleted_at);
        console.log('[Students] After deleted_at filter:',active.length);
        _allStudentsData=active.filter(d=>{
          const subjArr=typeof d.subjects==='string'?(()=>{try{return JSON.parse(d.subjects);}catch(e){return[];}}()):d.subjects;
          if(!Array.isArray(subjArr)||subjArr.length===0)return false;
          return subjArr.some(s=>{const sn=typeof s==='string'?s:(s.subject||s.name||'');return subjects.some(ts=>ts===sn);});
        }).map(d=>{
          const subjArr=typeof d.subjects==='string'?(()=>{try{return JSON.parse(d.subjects);}catch(e){return[];}}()):d.subjects;
          return{
            id:d.id,first_name:d.first_name,last_name:d.last_name,level:d.level,stream:d.stream,
            status:d.status,timestamp:d.timestamp||d.createdAt,
            matchedSubjects:(subjArr||[]).filter(s=>{const sn=typeof s==='string'?s:(s.subject||s.name||'');return subjects.includes(sn);}).map(s=>typeof s==='string'?s:(s.subject||s.name||''))
          };
        });
        console.log('[Students] Matched:',_allStudentsData.length,'of teacher subjects:',subjects);
        document.getElementById('students-count').textContent=_allStudentsData.length+' طالب';
        renderStudentsTable(_allStudentsData);
      }catch(e){
        console.error('Students error:',e);
        document.getElementById('students-table-wrap').innerHTML='<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">حدث خطأ أثناء تحميل بيانات الطلاب</div><div class="empty-state-sub">'+e.message+'</div></div>';
      }
    }
    function filterStudents(q){
      q=(q||'').trim().toLowerCase();
      if(!q){renderStudentsTable(_allStudentsData);return;}
      const filtered=_allStudentsData.filter(s=>{
        const name=((s.first_name||'')+' '+(s.last_name||'')).toLowerCase();
        const id=String(s.id||'');
        return name.includes(q)||id.includes(q);
      });
      renderStudentsTable(filtered);
    }
    function renderStudentsTable(students){
      const wrap=document.getElementById('students-table-wrap');
      if(!wrap)return;
      if(students.length===0){wrap.innerHTML='<div class="section-card"><div class="section-card-body"><div class="empty-state"><div class="empty-state-icon">👨‍🎓</div><div class="empty-state-text">لا يوجد طلاب مسجلون في موادك بعد</div><div class="empty-state-sub">سيظهر هنا الطلاب المسجلون نهائياً في موادك</div></div></div></div>';return;}
      wrap.innerHTML='<div class="section-card"><div class="section-card-body" style="padding:0;overflow-x:auto"><table class="data-table"><thead><tr><th>#</th><th>الاسم</th><th>رقم التسجيل</th><th>المستوى</th><th>المادة</th><th>تاريخ التسجيل</th></tr></thead><tbody>'+students.map((s,i)=>{const name=(s.first_name||'')+' '+(s.last_name||'');return '<tr><td style="font-weight:800;color:var(--text-muted)">'+(i+1)+'</td><td style="font-weight:700">'+name+'</td><td><code style="font-size:11px;background:var(--primary-light);padding:3px 10px;border-radius:6px;color:var(--primary)">'+s.id+'</code></td><td>'+(s.level||'—')+'</td><td style="font-size:12px">'+s.matchedSubjects.join('، ')+'</td><td style="font-size:12px">'+fmtDate(s.timestamp||s.createdAt)+'</td></tr>';}).join('')+'</tbody></table></div></div>';
    }

    /* ===== LOGIN ===== */
    function showLogin(errorMsg){
      document.getElementById('app').innerHTML=`<div class="login-screen">
        <div class="login-bg"><video autoplay muted loop playsinline><source src="videos/videobackgroundteacher.mp4" type="video/mp4"></video></div><div class="login-overlay"></div>
        <div class="login-shapes"><div class="login-shape"></div><div class="login-shape"></div><div class="login-shape"></div></div>
        <div class="login-card">
          <div class="login-logo-wrap"><img src="images/logoteacherportal.png" alt="E-PLUS"></div>
          <div class="login-role-badge">👨‍🏫 لوحة الأستاذ</div>
          <form onsubmit="handleLogin(event)">
            <div class="login-field"><label class="login-label">اسم المستخدم</label><div class="login-input-wrap"><span class="login-input-icon">👤</span><input class="login-input" type="text" id="login-id" placeholder="اسم المستخدم" required autocomplete="off"></div></div>
            <div class="login-field"><label class="login-label">كلمة المرور</label><div class="login-input-wrap"><span class="login-input-icon">🔒</span><input class="login-input" type="password" id="login-pass" placeholder="كلمة المرور" required autocomplete="off"><button type="button" class="login-toggle-pass" onclick="togglePassVisibility('login-pass',this)" title="إظهار كلمة المرور">👁️</button></div></div>
            <button class="login-btn" type="submit" id="login-btn"><span class="btn-text">تسجيل الدخول ✦</span><div class="btn-spinner"></div></button>
            <div class="login-error" id="login-error">${errorMsg||''}</div>
          </form>
          <div class="login-footer">E-PLUS — أكاديمية التعليم والدعم المدرسي</div>
        </div></div>`;
    }

    async function handleLogin(e){
      e.preventDefault();
      const username=document.getElementById('login-id').value.trim();
      const pass=document.getElementById('login-pass').value;
      const errEl=document.getElementById('login-error');
      const btn=document.getElementById('login-btn');
      if(!username||!pass){errEl.textContent='الرجاء ملء جميع الحقول';errEl.style.display='block';return;}
      btn.classList.add('loading');btn.disabled=true;errEl.style.display='none';
      try{
        const userSnap=await db.collection(USERS_COLLECTION).where('username','==',username).limit(1).get();
        if(userSnap.empty){errEl.textContent='اسم المستخدم غير صحيح.';errEl.style.display='block';btn.classList.remove('loading');btn.disabled=false;return;}
        const userDoc=userSnap.docs[0],userData=userDoc.data();
        if(userData.role!=='teacher'){errEl.textContent='اسم المستخدم غير صحيح.';errEl.style.display='block';btn.classList.remove('loading');btn.disabled=false;return;}
        if(userData.status!=='active'){errEl.textContent='تم تعطيل حسابك.';errEl.style.display='block';btn.classList.remove('loading');btn.disabled=false;return;}
        const computedHash=await hashPassword(pass,userData.passwordSalt);
        if(computedHash!==userData.passwordHash){errEl.textContent='كلمة المرور غير صحيحة.';errEl.style.display='block';btn.classList.remove('loading');btn.disabled=false;return;}
        const teacherSnap=await db.collection(SRT_COLLECTION).where('userId','==',userData.userId).limit(1).get();
        if(teacherSnap.empty){errEl.textContent='لا يوجد بروفايل مرتبط بهذا الحساب.';errEl.style.display='block';btn.classList.remove('loading');btn.disabled=false;return;}
        const teacherDoc=teacherSnap.docs[0],teacherData=teacherDoc.data();
        if(teacherData.status!=='active'){errEl.textContent='تم تعطيل حسابك.';errEl.style.display='block';btn.classList.remove('loading');btn.disabled=false;return;}
        saveSession(userData,{id:teacherDoc.id,...teacherData});
        try{await db.collection(USERS_COLLECTION).doc(userDoc.id).update({lastLogin:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){}
        renderDashboard({id:teacherDoc.id,...teacherData});
      }catch(err){console.error('Teacher login error:',err);errEl.textContent='حدث خطأ أثناء التحقق.';errEl.style.display='block';btn.classList.remove('loading');btn.disabled=false;}
    }

    /* ===== INIT ===== */
    async function init(){
      const session=getSession();
      if(session){
        if(session.role&&session.role!=='teacher'){clearSession();showLogin('صلاحيات غير كافية.');return;}
        document.getElementById('app').innerHTML='<div class="loading-page"><div class="spinner"></div></div>';
        try{const doc=await db.collection(SRT_COLLECTION).doc(session.teacherDocId).get();
          if(!doc.exists){clearSession();showLogin('حساب الأستاذ غير موجود.');return;}
          const data=doc.data();if(data.status!=='active'){clearSession();showLogin('تم تعطيل حسابك.');return;}
          renderDashboard({id:doc.id,...data});
        }catch(e){console.error('Session restore error:',e);clearSession();showLogin('حدث خطأ أثناء تحميل البيانات.');}
        return;
      }
      showLogin();
    }
    init();
  </script>
